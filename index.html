<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO 스마트 달력</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Malgun Gothic', -apple-system, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 10px; display: flex; justify-content: center; }
    .calendar-container { background: #ffffff; width: 100%; max-width: 800px; padding: 15px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    .header-status { background: #edf2f7; padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .status-text { font-size: 12px; font-weight: bold; color: #4a5568; word-break: break-all; }
    .btn-login { background: #3182ce; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .btn-logout { background: #e53e3e; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; white-space: nowrap; }

    .title-area { text-align: center; margin-bottom: 10px; }
    .title-area h2 { margin: 0; font-size: 22px; color: #1a202c; font-weight: bold; }

    .nav-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .nav-btn { background: #edf2f7; border: 1px solid #cbd5e0; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .current-month { font-size: 18px; font-weight: bold; color: #2d3748; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
    .day-header { font-weight: bold; padding: 6px 0; font-size: 13px; }
    .day-header.sun { color: #e53e3e; }
    .day-header.sat { color: #3182ce; }
    
    .date-cell { min-height: 85px; border: 1px solid #e2e8f0; border-radius: 6px; padding: 3px; background: white; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-start; text-align: left; overflow: hidden; }
    .date-cell:hover { background: #ebf8ff; }

    .date-header-row { display: flex; align-items: baseline; justify-content: flex-start; gap: 3px; }
    .date-num { font-size: 14px; font-weight: bold; }
    .sun .date-num, .holiday .date-num { color: #e53e3e; }
    .sat .date-num { color: #3182ce; }
    .lunar-text { font-size: 10px; color: #718096; }

    .solar-term { font-size: 9px; color: #2f855a; background: #c6f6d5; padding: 1px 2px; border-radius: 3px; margin-top: 2px; width: fit-content; white-space: nowrap; }
    .holiday-tag { font-size: 9px; color: #9b2c2c; background: #fed7d7; padding: 1px 2px; border-radius: 3px; margin-top: 2px; width: fit-content; font-weight: bold; white-space: nowrap; }
    .event-item { background: #ccfbf1; color: #0f766e; font-size: 10px; padding: 1px 3px; border-radius: 3px; margin-top: 2px; text-align: left; font-weight: bold; word-break: break-all; }
  </style>
</head>
<body>

<div class="calendar-container">
  <div class="header-status">
    <span id="status-text" class="status-text">🔒 동기화 미연결 (구글 로그인 시 실시간 연동)</span>
    <button id="btn-login" class="btn-login" onclick="handleLogin()">구글 계정 로그인</button>
    <button id="btn-logout" class="btn-logout" onclick="handleLogout()">로그아웃</button>
  </div>

  <div class="title-area">
    <h2>PRO 스마트 달력</h2>
  </div>

  <div class="nav-area">
    <button class="nav-btn" onclick="changeMonth(-1)">◀ 이전달</button>
    <span id="month-title" class="current-month">2026년 9월</span>
    <button class="nav-btn" onclick="changeMonth(1)">다음달 ▶</button>
  </div>

  <div class="calendar-grid">
    <div class="day-header sun">일</div>
    <div class="day-header">월</div>
    <div class="day-header">화</div>
    <div class="day-header">수</div>
    <div class="day-header">목</div>
    <div class="day-header">금</div>
    <div class="day-header sat">토</div>
  </div>
  <div id="calendar-days" class="calendar-grid"></div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDTOKW3Y3pEFikEMBQllyn46wP3_XInJhM",
    authDomain: "my-calendar-2b531.firebaseapp.com",
    projectId: "my-calendar-2b531",
    storageBucket: "my-calendar-2b531.firebasestorage.app",
    messagingSenderId: "391516744396",
    appId: "1:391516744396:web:214d5afeae8474df76b069"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentDate = new Date(2026, 8, 1);
  let currentUser = null;
  let userEvents = {};

  // 양력 고정 공휴일
  const solarHolidays = {
    "01-01": "신정",
    "03-01": "삼일절",
    "05-05": "어린이날",
    "06-06": "현충일",
    "08-15": "광복절",
    "10-03": "개천절",
    "10-09": "한글날",
    "12-25": "성탄절"
  };

  // 정확한 음력 계산 알고리즘
  function getExactLunarData(dateObj) {
    try {
      const formatter = new Intl.DateTimeFormat('ko-KR-u-ca-chinese', {
        month: 'numeric',
        day: 'numeric'
      });
      const parts = formatter.formatToParts(dateObj);
      let month = 0, day = 0;
      for (const part of parts) {
        if (part.type === 'month') month = parseInt(part.value.replace('월', '').trim());
        if (part.type === 'day') day = parseInt(part.value.replace('일', '').trim());
      }
      return { month, day, text: `${month}.${day}` };
    } catch (e) {
      return { month: 0, day: 0, text: '' };
    }
  }

  // 천문학적 24절기 연산 근사식
  function getSolarTerm(year, month, day) {
    const terms = ["소한","대한","입춘","우수","경칩","춘분","청명","곡우","입하","소만","망종","하지","소서","대서","입추","처서","백로","추분","한로","상강","입동","소설","대설","동지"];
    const stDates = [
      [1, 5, 20], [2, 4, 19], [3, 6, 21], [4, 5, 20],
      [5, 5, 21], [6, 6, 21], [7, 7, 23], [8, 7, 23],
      [9, 7, 23], [10, 8, 23], [11, 7, 22], [12, 7, 22]
    ];
    const mIdx = month - 1;
    if (day === stDates[mIdx][1]) return terms[mIdx * 2];
    if (day === stDates[mIdx][2]) return terms[mIdx * 2 + 1];
    return null;
  }

  // 삼복(초복, 중복, 말복) 연산
  function getSamBok(year, month, day) {
    // 2026~2028년 복날 근사 기준
    const bokTable = {
      2026: { cho: "07-15", jung: "07-25", mal: "08-14" },
      2027: { cho: "07-16", jung: "07-26", mal: "08-15" },
      2028: { cho: "07-15", jung: "07-25", mal: "08-13" }
    };
    const key = `${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    if (bokTable[year]) {
      if (key === bokTable[year].cho) return "초복";
      if (key === bokTable[year].jung) return "중복";
      if (key === bokTable[year].mal) return "말복";
    }
    return null;
  }

  function handleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(error => { alert("로그인 오류: " + error.message); });
  }

  function handleLogout() { auth.signOut(); }

  auth.onAuthStateChanged(user => {
    currentUser = user;
    const statusText = document.getElementById("status-text");
    const btnLogin = document.getElementById("btn-login");
    const btnLogout = document.getElementById("btn-logout");

    if (user) {
      statusText.innerText = "☁️ 동기화 완료 (" + user.displayName + "님)";
      btnLogin.style.display = "none";
      btnLogout.style.display = "inline-block";
      loadUserEvents();
    } else {
      statusText.innerText = "🔒 동기화 미연결";
      btnLogin.style.display = "inline-block";
      btnLogout.style.display = "none";
      userEvents = {};
      renderCalendar();
    }
  });

  function changeMonth(diff) {
    currentDate.setMonth(currentDate.getMonth() + diff);
    renderCalendar();
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("month-title").innerText = `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const calendarDays = document.getElementById("calendar-days");
    calendarDays.innerHTML = "";

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement("div");
      emptyCell.className = "date-cell";
      calendarDays.appendChild(emptyCell);
    }

    for (let date = 1; date <= lastDate; date++) {
      const cell = document.createElement("div");
      const dayOfWeek = (firstDay + date - 1) % 7;
      const mm = String(month + 1).padStart(2, '0');
      const dd = String(date).padStart(2, '0');
      const dateStr = `${year}-${mm}-${dd}`;
      const mdKey = `${mm}-${dd}`;
      
      let dayClass = "date-cell";
      if (dayOfWeek === 0) dayClass += " sun";
      if (dayOfWeek === 6) dayClass += " sat";

      // 음력 연산
      const targetDate = new Date(year, month, date);
      const lunar = getExactLunarData(targetDate);

      // 공휴일 판별 (양력/음력 명절)
      let holidayName = solarHolidays[mdKey] || null;

      // 음력 명절 자동 체크
      if (lunar.month === 1 && lunar.day === 1) holidayName = "설날";
      if (lunar.month === 12 && lunar.day >= 29) holidayName = "설날 연휴"; // 음력 섣달그믐
      if (lunar.month === 1 && lunar.day === 2) holidayName = "설날 연휴";
      if (lunar.month === 4 && lunar.day === 8) holidayName = "부처님오신날";
      if (lunar.month === 8 && lunar.day === 14) holidayName = "추석 연휴";
      if (lunar.month === 8 && lunar.day === 15) holidayName = "추석";
      if (lunar.month === 8 && lunar.day === 16) holidayName = "추석 연휴";

      if (holidayName) dayClass += " holiday";

      cell.className = dayClass;

      // 절기 및 복날 체크
      const termName = getSolarTerm(year, month + 1, date);
      const bokName = getSamBok(year, month + 1, date);

      let extraHtml = "";
      if (holidayName) extraHtml += `<div class="holiday-tag">🔴 ${holidayName}</div>`;
      if (termName) extraHtml += `<div class="solar-term">🥬 ${termName}</div>`;
      if (bokName) extraHtml += `<div class="solar-term">🍗 ${bokName}</div>`;
      if (userEvents[dateStr]) extraHtml += `<div class="event-item">📌 ${userEvents[dateStr]}</div>`;

      cell.innerHTML = `
        <div class="date-header-row">
          <span class="date-num">${date}</span>
          <span class="lunar-text">(${lunar.text})</span>
        </div>
        ${extraHtml}
      `;

      cell.onclick = () => addEvent(dateStr);
      calendarDays.appendChild(cell);
    }
  }

  function addEvent(dateStr) {
    if (!currentUser) {
      alert("일정을 저장하려면 먼저 [구글 계정 로그인]을 진행해 주세요!");
      return;
    }
    const memo = prompt(`${dateStr} 일정을 입력하세요:`, userEvents[dateStr] || "");
    if (memo !== null) {
      if (memo.trim() === "") {
        delete userEvents[dateStr];
      } else {
        userEvents[dateStr] = memo.trim();
      }
      db.collection("users").doc(currentUser.uid).set({ events: userEvents }, { merge: true })
        .then(() => { renderCalendar(); });
    }
  }

  function loadUserEvents() {
    if (!currentUser) return;
    db.collection("users").doc(currentUser.uid).get().then(doc => {
      if (doc.exists && doc.data().events) {
        userEvents = doc.data().events;
      }
      renderCalendar();
    });
  }

  renderCalendar();
</script>
</body>
</html>
