<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지우 할아버지의 달력</title>
  
  <!-- Firebase SDK (v9/v10 호환 라이브러리) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Malgun Gothic', sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .calendar-container { background: #ffffff; width: 100%; max-width: 500px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    .header-status { background: #edf2f7; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .status-text { font-size: 14px; font-weight: bold; color: #4a5568; }
    .btn-login { background: #3182ce; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-logout { background: #e53e3e; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; display: none; }

    .title-area { text-align: center; margin-bottom: 15px; }
    .title-area h2 { margin: 0; font-size: 24px; color: #2d3748; }

    .nav-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .nav-btn { background: #edf2f7; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .current-month { font-size: 18px; font-weight: bold; color: #2d3748; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .day-header { font-weight: bold; padding: 8px 0; font-size: 14px; }
    .day-header.sun { color: #e53e3e; }
    .day-header.sat { color: #3182ce; }
    
    .date-cell { min-height: 65px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 4px; background: white; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-start; }
    .date-cell:hover { background: #ebf8ff; }
    .date-num { font-size: 14px; font-weight: bold; text-align: left; }
    .sun .date-num { color: #e53e3e; }
    .sat .date-num { color: #3182ce; }
    
    .event-item { background: #feebc8; color: #742a2a; font-size: 11px; padding: 2px 4px; border-radius: 4px; margin-top: 2px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>

<div class="calendar-container">
  <!-- 로그인 상태 표시 바 -->
  <div class="header-status">
    <span id="status-text" class="status-text">🔒 동기화 미연결 (로그인 필요)</span>
    <button id="btn-login" class="btn-login" onclick="handleLogin()">구글 계정 로그인</button>
    <button id="btn-logout" class="btn-logout" onclick="handleLogout()">로그아웃</button>
  </div>

  <!-- 타이틀 -->
  <div class="title-area">
    <h2>지우 할아버지의 달력</h2>
  </div>

  <!-- 달 이동 네비게이션 -->
  <div class="nav-area">
    <button class="nav-btn" onclick="changeMonth(-1)">◀ 이전달</button>
    <span id="month-title" class="current-month">2026년 9월</span>
    <button class="nav-btn" onclick="changeMonth(1)">다음달 ▶</button>
  </div>

  <!-- 달력 출력 영역 -->
  <div class="calendar-grid">
    <div class="day-header sun">일</div>
    <div class="day-header">월</div>
    <div class="day-header">화</div>
    <div class="day-header">수</div>
    <div class="day-header">목</div>
    <div class="day-header">금</div>
    <div class="day-header sat">토</div>
  </div>
  <div id="calendar-days" class="calendar-grid"></div>
</div>

<script>
  // 1. 발급받으신 파이어베이스 설정 정보
  const firebaseConfig = {
    apiKey: "AIzaSyDTOKW3Y3pEFikEMBQllyn46wP3_XInJhM",
    authDomain: "my-calendar-2b531.firebaseapp.com",
    projectId: "my-calendar-2b531",
    storageBucket: "my-calendar-2b531.firebasestorage.app",
    messagingSenderId: "391516744396",
    appId: "1:391516744396:web:214d5afeae8474df76b069"
  };

  // 2. 파이어베이스 초기화
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentDate = new Date(2026, 8, 1); // 2026년 9월 기본 설정
  let currentUser = null;
  let events = {};

  // 3. 구글 로그인 처리
  function handleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(error => {
      alert("로그인 실패: " + error.message);
    });
  }

  // 4. 로그아웃 처리
  function handleLogout() {
    auth.signOut();
  }

  // 5. 인증 상태 감지
  auth.onAuthStateChanged(user => {
    currentUser = user;
    const statusText = document.getElementById("status-text");
    const btnLogin = document.getElementById("btn-login");
    const btnLogout = document.getElementById("btn-logout");

    if (user) {
      statusText.innerText = "☁️ 동기화 완료 (" + user.displayName + "님)";
      btnLogin.style.display = "none";
      btnLogout.style.display = "inline-block";
      loadEvents();
    } else {
      statusText.innerText = "🔒 동기화 미연결 (로그인 필요)";
      btnLogin.style.display = "inline-block";
      btnLogout.style.display = "none";
      events = {};
      renderCalendar();
    }
  });

  // 6. 달력 연도/월 이동
  function changeMonth(diff) {
    currentDate.setMonth(currentDate.getMonth() + diff);
    renderCalendar();
    if (currentUser) loadEvents();
  }

  // 7. 달력 화면 그리기
  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("month-title").innerText = `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const calendarDays = document.getElementById("calendar-days");
    calendarDays.innerHTML = "";

    // 빈 날짜 칸
    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement("div");
      emptyCell.className = "date-cell";
      calendarDays.appendChild(emptyCell);
    }

    // 일자 생성
    for (let date = 1; date <= lastDate; date++) {
      const cell = document.createElement("div");
      const dayOfWeek = (firstDay + date - 1) % 7;
      
      let dayClass = "date-cell";
      if (dayOfWeek === 0) dayClass += " sun";
      if (dayOfWeek === 6) dayClass += " sat";
      cell.className = dayClass;

      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;

      let eventHtml = "";
      if (events[dateStr]) {
        eventHtml = `<div class="event-item">${events[dateStr]}</div>`;
      }

      cell.innerHTML = `<div class="date-num">${date}</div>${eventHtml}`;
      cell.onclick = () => addEvent(dateStr);

      calendarDays.appendChild(cell);
    }
  }

  // 8. 일정 추가 및 파이어베이스 저장
  function addEvent(dateStr) {
    if (!currentUser) {
      alert("일정을 저장하려면 먼저 구글 로그인을 진행해주세요.");
      return;
    }
    const title = prompt(`${dateStr} 일정을 입력하세요:`, events[dateStr] || "");
    if (title !== null) {
      if (title.trim() === "") {
        delete events[dateStr];
        db.collection("users").doc(currentUser.uid).collection("events").doc(dateStr).delete();
      } else {
        events[dateStr] = title;
        db.collection("users").doc(currentUser.uid).collection("events").doc(dateStr).set({ title: title });
      }
      renderCalendar();
    }
  }

  // 9. 파이어베이스 데이터 불러오기
  function loadEvents() {
    if (!currentUser) return;
    db.collection("users").doc(currentUser.uid).collection("events").get().then(snapshot => {
      events = {};
      snapshot.forEach(doc => {
        events[doc.id] = doc.data().title;
      });
      renderCalendar();
    });
  }

  // 최초 달력 표시
  renderCalendar();
</script>

</body>
</html>
