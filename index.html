<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO 스마트 달력</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Malgun Gothic', -apple-system, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 10px; display: flex; justify-content: center; }
    .calendar-container { background: #ffffff; width: 100%; max-width: 800px; padding: 15px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    .header-status { background: #edf2f7; padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .status-text { font-size: 12px; font-weight: bold; color: #4a5568; word-break: break-all; }
    .btn-login { background: #3182ce; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .btn-logout { background: #e53e3e; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; white-space: nowrap; }

    .title-area { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
    .title-area h2 { margin: 0; font-size: 22px; color: #1a202c; font-weight: bold; }
    .btn-edit-title { background: #e2e8f0; border: 1px solid #cbd5e0; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; color: #2d3748; }

    .nav-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .nav-btn { background: #edf2f7; border: 1px solid #cbd5e0; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .current-month { font-size: 18px; font-weight: bold; color: #2d3748; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
    .day-header { font-weight: bold; padding: 6px 0; font-size: 13px; }
    .day-header.sun { color: #e53e3e; }
    .day-header.sat { color: #3182ce; }
    
    .date-cell { min-height: 90px; border: 1px solid #e2e8f0; border-radius: 6px; padding: 3px; background: white; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-start; text-align: left; overflow: hidden; }
    .date-cell:hover { background: #ebf8ff; }

    .date-header-row { display: flex; align-items: baseline; justify-content: flex-start; gap: 3px; }
    .date-num { font-size: 14px; font-weight: bold; }
    .sun .date-num, .holiday .date-num { color: #e53e3e; }
    .sat .date-num { color: #3182ce; }
    .lunar-text { font-size: 10px; color: #718096; }

    .solar-term { font-size: 9px; color: #2f855a; background: #c6f6d5; padding: 1px 3px; border-radius: 3px; margin-top: 2px; width: fit-content; white-space: nowrap; }
    .holiday-tag { font-size: 9px; color: #9b2c2c; background: #fed7d7; padding: 1px 3px; border-radius: 3px; margin-top: 2px; width: fit-content; font-weight: bold; white-space: nowrap; }
    
    .event-item { 
      font-size: 11px; 
      padding: 2px 4px; 
      border-radius: 4px; 
      margin-top: 2px; 
      text-align: left; 
      font-weight: bold; 
      line-height: 1.2;
      word-break: break-all;
    }

    .hl-mint   { background: #ccfbf1; color: #0f766e; }
    .hl-yellow { background: #fef08a; color: #854d0e; }
    .hl-green  { background: #bbf7d0; color: #166534; }
    .hl-pink   { background: #fbcfe8; color: #9d174d; }
    .hl-blue   { background: #bfdbfe; color: #1e40af; }
    .hl-orange { background: #fed7aa; color: #9a3412; }

    .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; }
    .modal-content h3 { margin-top: 0; color: #2d3748; }
    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #4a5568; }
    .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; }

    .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
    .btn-save { background: #3182ce; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-delete { background: #e53e3e; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-cancel { background: #a0aec0; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="calendar-container">
  <div class="header-status">
    <span id="status-text" class="status-text">🔒 동기화 미연결 (구글 로그인 시 실시간 연동)</span>
    <button id="btn-login" class="btn-login" onclick="handleLogin()">구글 계정 로그인</button>
    <button id="btn-logout" class="btn-logout" onclick="handleLogout()">로그아웃</button>
  </div>

  <div class="title-area">
    <h2 id="calendar-main-title">PRO 스마트 달력</h2>
    <button class="btn-edit-title" onclick="editCalendarTitle()">✏️ 제목 수정</button>
  </div>

  <div class="nav-area">
    <button class="nav-btn" onclick="changeMonth(-1)">◀ 이전달</button>
    <span id="month-title" class="current-month">2027년 1월</span>
    <button class="nav-btn" onclick="changeMonth(1)">다음달 ▶</button>
  </div>

  <div class="calendar-grid">
    <div class="day-header sun">일</div>
    <div class="day-header">월</div>
    <div class="day-header">화</div>
    <div class="day-header">수</div>
    <div class="day-header">목</div>
    <div class="day-header">금</div>
    <div class="day-header sat">토</div>
  </div>
  <div id="calendar-days" class="calendar-grid"></div>
</div>

<div id="eventModal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="modalDateTitle">일정 및 알림 설정</h3>
    <div class="form-group">
      <label>일정 내용</label>
      <input type="text" id="inputMemo" placeholder="예: 서부본부 교육, 생일 등">
    </div>
    <div class="form-group">
      <label>형광펜 (배경 색상)</label>
      <select id="selectColor">
        <option value="hl-mint">민트 (기본)</option>
        <option value="hl-yellow">노랑</option>
        <option value="hl-green">초록</option>
        <option value="hl-pink">분홍</option>
        <option value="hl-blue">파랑</option>
        <option value="hl-orange">주황</option>
      </select>
    </div>
    <div class="form-group">
      <label>양력 / 음력 선택</label>
      <select id="selectCalendarType">
        <option value="solar">양력 기준</option>
        <option value="lunar">음력 기준 (생신/제사 등)</option>
      </select>
    </div>
    <div class="form-group">
      <label>반복 설정</label>
      <select id="selectRepeat">
        <option value="none">반복 안함</option>
        <option value="yearly">매년 반복 (생일, 기념일)</option>
        <option value="monthly">매월 반복 (정기 모임/교육)</option>
      </select>
    </div>
    <div class="form-group">
      <label>알림 시점</label>
      <select id="selectAlertTiming">
        <option value="0">당일 알림</option>
        <option value="1">1일 전 (전일) 알림</option>
        <option value="2">2일 전 알림</option>
        <option value="3">3일 전 알림</option>
      </select>
    </div>
    <div class="form-group">
      <label>알림 시간 설정</label>
      <input type="time" id="inputTime">
    </div>
    <div class="modal-buttons">
      <button class="btn-delete" id="btnDeleteEvent" onclick="deleteCurrentEvent()">삭제</button>
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveEvent()">저장</button>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDTOKW3Y3pEFikEMBQllyn46wP3_XInJhM",
    authDomain: "my-calendar-2b531.firebaseapp.com",
    projectId: "my-calendar-2b531",
    storageBucket: "my-calendar-2b531.firebasestorage.app",
    messagingSenderId: "391516744396",
    appId: "1:391516744396:web:214d5afeae8474df76b069"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentDate = new Date(2027, 0, 1);
  let currentUser = null;
  let selectedDateStr = "";
  
  let userEvents = {};
  let calendarTitle = "PRO 스마트 달력";

  if ("Notification" in window && Notification.permission !== "granted") {
    Notification.requestPermission();
  }

  setInterval(checkTimerAlerts, 30000);

  function checkTimerAlerts() {
    const now = new Date();
    const currentTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

    for (let dateKey in userEvents) {
      const item = userEvents[dateKey];
      if (!item.time) continue;

      const timingOffset = parseInt(item.timing || "0", 10);
      const targetCheckDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + timingOffset);
      const ty = targetCheckDate.getFullYear();
      const tm = String(targetCheckDate.getMonth() + 1).padStart(2, '0');
      const td = String(targetCheckDate.getDate()).padStart(2, '0');
      const targetStr = `${ty}-${tm}-${td}`;
      const targetLunarMD = getExactLunarDate(ty, targetCheckDate.getMonth() + 1, targetCheckDate.getDate());

      let isMatch = false;
      const isLunar = item.calType === "lunar";

      if (item.repeat === "yearly") {
        if (isLunar && item.lunarMD === targetLunarMD) isMatch = true;
        else if (!isLunar && dateKey.substring(5) === `${tm}-${td}`) isMatch = true;
      } else if (item.repeat === "monthly") {
        if (dateKey.substring(8) === td) isMatch = true;
      } else if (dateKey === targetStr) {
        isMatch = true;
      }

      if (isMatch && item.time === currentTimeStr && !item.alerted) {
        item.alerted = true;
        const timingPrefix = timingOffset > 0 ? `[D-${timingOffset} 알림] ` : `[당일 알림] `;
        const alertMsg = `⏰ ${timingPrefix}${item.memo} (${item.time})`;
        if (Notification.permission === "granted") {
          new Notification(alertMsg);
        }
        alert(alertMsg);
      }
    }
  }

  // 통합 절기, 삼복 및 공휴일 데이터베이스 (2026 ~ 2027)
  const calendarDB = {
    // --- 2026년 ---
    "2026-01-01": { holiday: "신정" }, "2026-01-05": { term: "소한" }, "2026-01-20": { term: "대한" },
    "2026-02-04": { term: "입춘" }, "2026-02-16": { holiday: "설날 연휴" }, "2026-02-17": { holiday: "설날" }, "2026-02-18": { holiday: "설날 연휴" }, "2026-02-19": { term: "우수" },
    "2026-03-01": { holiday: "삼일절" }, "2026-03-02": { holiday: "대체공휴일" }, "2026-03-06": { term: "경칩" }, "2026-03-21": { term: "춘분" },
    "2026-04-05": { term: "청명" }, "2026-04-20": { term: "곡우" },
    "2026-05-05": { holiday: "어린이날", term: "입하" }, "2026-05-21": { term: "소만" }, "2026-05-24": { holiday: "부처님오신날" }, "2026-05-25": { holiday: "대체공휴일" },
    "2026-06-06": { holiday: "현충일", term: "망종" }, "2026-06-21": { term: "하지" },
    "2026-07-07": { term: "소서" }, "2026-07-15": { term: "초복" }, "2026-07-23": { term: "대서" }, "2026-07-25": { term: "중복" },
    "2026-08-07": { term: "입추" }, "2026-08-14": { term: "말복" }, "2026-08-15": { holiday: "광복절" }, "2026-08-23": { term: "처서" },
    "2026-09-07": { term: "백로" }, "2026-09-23": { term: "추분" }, "2026-09-24": { holiday: "추석 연휴" }, "2026-09-25": { holiday: "추석" }, "2026-09-26": { holiday: "추석 연휴" },
    "2026-10-03": { holiday: "개천절" }, "2026-10-08": { term: "한로" }, "2026-10-09": { holiday: "한글날" }, "2026-10-23": { term: "상강" },
    "2026-11-07": { term: "입동" }, "2026-11-22": { term: "소설" },
    "2026-12-07": { term: "대설" }, "2026-12-22": { term: "동지" }, "2026-12-25": { holiday: "성탄절" },

    // --- 2027년 ---
    "2027-01-01": { holiday: "신정" }, "2027-01-05": { term: "소한" }, "2027-01-20": { term: "대한" },
    "2027-02-04": { term: "입춘" }, "2027-02-06": { holiday: "설날 연휴" }, "2027-02-07": { holiday: "설날" }, "2027-02-08": { holiday: "설날 연휴" }, "2027-02-09": { holiday: "대체공휴일" }, "2027-02-19": { term: "우수" },
    "2027-03-01": { holiday: "삼일절" }, "2027-03-06": { term: "경칩" }, "2027-03-21": { term: "춘분" },
    "2027-04-05": { term: "청명" }, "2027-04-20": { term: "곡우" },
    "2027-05-05": { holiday: "어린이날" }, "2027-05-06": { term: "입하" }, "2027-05-13": { holiday: "부처님오신날" }, "2027-05-21": { term: "소만" },
    "2027-06-06": { holiday: "현충일", term: "망종" }, "2027-06-07": { holiday: "대체공휴일" }, "2027-06-22": { term: "하지" },
    "2027-07-07": { term: "소서" }, "2027-07-16": { term: "초복" }, "2027-07-23": { term: "대서" }, "2027-07-26": { term: "중복" },
    "2027-08-08": { term: "입추" }, "2027-08-15": { holiday: "광복절", term: "말복" }, "2027-08-16": { holiday: "대체공휴일" }, "2027-08-23": { term: "처서" },
    "2027-09-08": { term: "백로" }, "2027-09-14": { holiday: "추석 연휴" }, "2027-09-15": { holiday: "추석" }, "2027-09-16": { holiday: "추석 연휴" }, "2027-09-23": { term: "추분" },
    "2027-10-03": { holiday: "개천절" }, "2027-10-04": { holiday: "대체공휴일" }, "2027-10-08": { term: "한로" }, "2027-10-09": { holiday: "한글날" }, "2027-10-23": { term: "상강" },
    "2027-11-07": { term: "입동" }, "2027-11-22": { term: "소설" },
    "2027-12-07": { term: "대설" }, "2027-12-22": { term: "동지" }, "2027-12-25": { holiday: "성탄절" }
  };

  // 고정 양력 공휴일 (연도 불문)
  const fixedHolidays = {
    "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날", "06-06": "현충일",
    "08-15": "광복절", "10-03": "개천절", "10-09": "한글날", "12-25": "성탄절"
  };

  function getExactLunarDate(year, month, day) {
    try {
      const dateObj = new Date(year, month - 1, day);
      const formatter = new Intl.DateTimeFormat('ko-KR-u-ca-chinese', { month: 'numeric', day: 'numeric' });
      const parts = formatter.formatToParts(dateObj);
      let m = '', d = '';
      for (const part of parts) {
        if (part.type === 'month') m = part.value.replace('월', '').trim();
        if (part.type === 'day') d = part.value.replace('일', '').trim();
      }
      return `${m}.${d}`;
    } catch (e) { return ''; }
  }

  function editCalendarTitle() {
    const newTitle = prompt("새로운 달력 이름을 입력하세요:", calendarTitle);
    if (newTitle !== null && newTitle.trim() !== "") {
      calendarTitle = newTitle.trim();
      document.getElementById("calendar-main-title").innerText = calendarTitle;
      document.title = calendarTitle;
      if (currentUser) db.collection("users").doc(currentUser.uid).set({ title: calendarTitle }, { merge: true });
    }
  }

  function handleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(error => { alert("로그인 오류: " + error.message); });
  }

  function handleLogout() { auth.signOut(); }

  auth.onAuthStateChanged(user => {
    currentUser = user;
    const statusText = document.getElementById("status-text");
    const btnLogin = document.getElementById("btn-login");
    const btnLogout = document.getElementById("btn-logout");

    if (user) {
      statusText.innerText = "☁️ 동기화 완료 (" + user.displayName + "님)";
      btnLogin.style.display = "none";
      btnLogout.style.display = "inline-block";
      loadUserData();
    } else {
      statusText.innerText = "🔒 동기화 미연결";
      btnLogin.style.display = "inline-block";
      btnLogout.style.display = "none";
      renderCalendar();
    }
  });

  function changeMonth(diff) {
    currentDate.setMonth(currentDate.getMonth() + diff);
    renderCalendar();
  }

  function getEventForDate(year, month, day) {
    const mm = String(month).padStart(2, '0');
    const dd = String(day).padStart(2, '0');
    const fullKey = `${year}-${mm}-${dd}`;
    const monthDayKey = `${mm}-${dd}`;
    const lunarMD = getExactLunarDate(year, month, day);

    let eventList = [];

    for (let key in userEvents) {
      const item = typeof userEvents[key] === 'string' ? { memo: userEvents[key], calType: 'solar', repeat: 'none', timing: '0', time: '', color: 'hl-mint' } : userEvents[key];
      const isLunar = item.calType === 'lunar';

      if (key === fullKey) {
        eventList.push(item);
      } else if (item.repeat === 'yearly') {
        if (isLunar && item.lunarMD && item.lunarMD === lunarMD) {
          eventList.push(item);
        } else if (!isLunar && key.substring(5) === monthDayKey) {
          eventList.push(item);
        }
      } else if (item.repeat === 'monthly' && key.substring(8) === dd) {
        eventList.push(item);
      }
    }
    return eventList;
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("month-title").innerText = `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const calendarDays = document.getElementById("calendar-days");
    calendarDays.innerHTML = "";

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement("div");
      emptyCell.className = "date-cell";
      calendarDays.appendChild(emptyCell);
    }

    for (let date = 1; date <= lastDate; date++) {
      const cell = document.createElement("div");
      const dayOfWeek = (firstDay + date - 1) % 7;
      const mm = String(month + 1).padStart(2, '0');
      const dd = String(date).padStart(2, '0');
      const dateStr = `${year}-${mm}-${dd}`;
      const mdKey = `${mm}-${dd}`;
      
      let dayClass = "date-cell";
      if (dayOfWeek === 0) dayClass += " sun";
      if (dayOfWeek === 6) dayClass += " sat";

      const info = calendarDB[dateStr] || {};
      const fixedHoliday = fixedHolidays[mdKey];
      const holidayName = info.holiday || fixedHoliday;

      if (holidayName) dayClass += " holiday";
      cell.className = dayClass;

      const lunarText = getExactLunarDate(year, month + 1, date);
      const matchedEvents = getEventForDate(year, month + 1, date);

      let extraHtml = "";
      if (holidayName) extraHtml += `<div class="holiday-tag">🔴 ${holidayName}</div>`;
      if (info.term) extraHtml += `<div class="solar-term">🥬 ${info.term}</div>`;
      
      matchedEvents.forEach(evt => {
        let typeBadge = evt.calType === 'lunar' ? '(음) ' : '';
        let colorClass = evt.color || 'hl-mint';
        extraHtml += `<div class="event-item ${colorClass}">${typeBadge}${evt.memo}</div>`;
      });

      cell.innerHTML = `
        <div class="date-header-row">
          <span class="date-num">${date}</span>
          <span class="lunar-text">(${lunarText})</span>
        </div>
        ${extraHtml}
      `;

      cell.onclick = () => openModal(dateStr, year, month + 1, date);
      calendarDays.appendChild(cell);
    }
  }

  function openModal(dateStr, y, m, d) {
    selectedDateStr = dateStr;
    const lunarMD = getExactLunarDate(y, m, d);
    document.getElementById("modalDateTitle").innerText = `${dateStr} (음력 ${lunarMD}) 일정 설정`;
    
    const existing = userEvents[dateStr] || {};
    document.getElementById("inputMemo").value = existing.memo || (typeof existing === 'string' ? existing : "");
    document.getElementById("selectColor").value = existing.color || "hl-mint";
    document.getElementById("selectCalendarType").value = existing.calType || "solar";
    document.getElementById("selectRepeat").value = existing.repeat || "none";
    document.getElementById("selectAlertTiming").value = existing.timing || "0";
    document.getElementById("inputTime").value = existing.time || "";

    document.getElementById("eventModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("eventModal").style.display = "none";
  }

  function saveEvent() {
    const memo = document.getElementById("inputMemo").value.trim();
    const color = document.getElementById("selectColor").value;
    const calType = document.getElementById("selectCalendarType").value;
    const repeat = document.getElementById("selectRepeat").value;
    const timing = document.getElementById("selectAlertTiming").value;
    const time = document.getElementById("inputTime").value;

    const parts = selectedDateStr.split('-');
    const lunarMD = getExactLunarDate(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));

    if (memo === "") {
      delete userEvents[selectedDateStr];
    } else {
      userEvents[selectedDateStr] = { memo, color, calType, repeat, timing, time, lunarMD, alerted: false };
    }

    if (currentUser) {
      db.collection("users").doc(currentUser.uid).set({ events: userEvents }, { merge: true });
    }

    closeModal();
    renderCalendar();
  }

  function deleteCurrentEvent() {
    delete userEvents[selectedDateStr];
    if (currentUser) {
      db.collection("users").doc(currentUser.uid).set({ events: userEvents }, { merge: true });
    }
    closeModal();
    renderCalendar();
  }

  function loadUserData() {
    if (!currentUser) return;
    db.collection("users").doc(currentUser.uid).get().then(doc => {
      if (doc.exists) {
        const data = doc.data();
        if (data.events) {
          userEvents = Object.assign({}, userEvents, data.events);
        }
        if (data.title) {
          calendarTitle = data.title;
          document.getElementById("calendar-main-title").innerText = calendarTitle;
          document.title = calendarTitle;
        }
      }
      db.collection("users").doc(currentUser.uid).set({ events: userEvents }, { merge: true });
      renderCalendar();
    });
  }

  renderCalendar();
</script>
</body>
</html>
