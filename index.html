<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>만년 달력 (실시간 동기화 지원)</title>
    
    <!-- Netlify Identity 위젯 스크립트 -->
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        /* 상단 컨트롤 및 로그인 영역 스타일 */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .auth-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        #auth-btn {
            background: #4285F4;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        #auth-btn:hover {
            opacity: 0.9;
        }

        #user-info {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 4px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        button.nav-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }

        button.nav-btn:hover {
            opacity: 0.9;
        }

        h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        /* 달력 그리드 스타일 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .day-name {
            text-align: center;
            font-weight: bold;
            padding: 10px 0;
            color: #64748b;
        }

        .day-name:nth-child(1) { color: #ef4444; } /* 일요일 빨간색 */
        .day-name:nth-child(7) { color: #3b82f6; } /* 토요일 파란색 */

        .day-cell {
            min-height: 90px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .day-cell:hover {
            border-color: var(--primary-color);
        }

        .day-number {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .day-cell:nth-child(7n+1) .day-number { color: #ef4444; } /* 일요일 날짜 */
        .day-cell:nth-child(7n) .day-number { color: #3b82f6; }   /* 토요일 날짜 */

        .lunar-info {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .event-badge {
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 0.7rem;
            padding: 2px 4px;
            border-radius: 4px;
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .other-month {
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 헤더 및 로그인 연동 버튼 -->
        <div class="header-top">
            <h1 style="font-size: 1.2rem; margin: 0; color: #334155;">📅 스마트 만년 달력</h1>
            <div class="auth-section">
                <button id="auth-btn" onclick="toggleAuth()">구글 로그인</button>
                <div id="user-info">로그인하지 않으면 이 기기에만 저장됩니다.</div>
            </div>
        </div>

        <!-- 달력 월 이동 컨트롤 -->
        <div class="controls">
            <button class="nav-btn" onclick="changeMonth(-1)">◀ 이전 달</button>
            <h2 id="month-year">YYYY년 M월</h2>
            <button class="nav-btn" onclick="changeMonth(1)">다음 달 ▶</button>
        </div>

        <!-- 달력 본체 -->
        <div class="calendar-grid" id="calendar">
            <!-- 요일 헤더 -->
            <div class="day-name">일</div>
            <div class="day-name">월</div>
            <div class="day-name">화</div>
            <div class="day-name">수</div>
            <div class="day-name">목</div>
            <div class="day-name">금</div>
            <div class="day-name">토</div>
            <!-- 날짜 셀들이 여기에 동적으로 생성됩니다 -->
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let events = JSON.parse(localStorage.getItem('calendar_events')) || {};

        // Netlify Identity 이벤트 리스너 초기화
        document.addEventListener("DOMContentLoaded", function() {
            if (window.netlifyIdentity) {
                window.netlifyIdentity.on("init", user => {
                    updateAuthUI(user);
                });
                window.netlifyIdentity.on("login", user => {
                    updateAuthUI(user);
                    window.netlifyIdentity.close();
                    alert(user.email + "님 환영합니다! 구글 계정과 연동되었습니다.");
                    location.reload();
                });
                window.netlifyIdentity.on("logout", () => {
                    updateAuthUI(null);
                    alert("로그아웃 되었습니다.");
                    location.reload();
                });
            }
            renderCalendar();
        });

        // 로그인 버튼 동작 함수
        function toggleAuth() {
            const user = window.netlifyIdentity.currentUser();
            if (!user) {
                window.netlifyIdentity.open(); // 로그인창 띄우기
            } else {
                window.netlifyIdentity.logout(); // 로그아웃
            }
        }

        // UI에 로그인 상태 반영
        function updateAuthUI(user) {
            const authBtn = document.getElementById("auth-btn");
            const userInfo = document.getElementById("user-info");
            
            if (user) {
                authBtn.textContent = "로그아웃";
                authBtn.style.background = "#ef4444"; // 빨간색
                userInfo.textContent = `연동된 계정: ${user.email} (실시간 동기화 활성화)`;
            } else {
                authBtn.textContent = "구글 로그인";
                authBtn.style.background = "#4285F4"; // 파란색
                userInfo.textContent = "로그인하지 않으면 이 기기에만 일정이 저장됩니다.";
            }
        }

        // 달력 렌더링 함수
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById("month-year").textContent = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            const calendarGrid = document.getElementById("calendar");
            
            // 기존 요일 헤더를 제외한 날짜 셀들 초기화
            while (calendarGrid.children.length > 7) {
                calendarGrid.removeChild(calendarGrid.lastChild);
            }

            // 지난 달 빈 자리 채우기
            for (let i = firstDayIndex; i > 0; i--) {
                const cell = createDayCell(prevLastDay - i + 1, true);
                calendarGrid.appendChild(cell);
            }

            // 이번 달 날짜 채우기
            for (let i = 1; i <= lastDay; i++) {
                const cell = createDayCell(i, false, year, month);
                calendarGrid.appendChild(cell);
            }

            // 다음 달 빈 자리 채우기 (총 42칸 맞추기)
            const totalCells = calendarGrid.children.length - 7;
            const remainingCells = (totalCells <= 35 ? 35 : 42) - totalCells;
            for (let i = 1; i <= remainingCells; i++) {
                const cell = createDayCell(i, true);
                calendarGrid.appendChild(cell);
            }
        }

        // 개별 날짜 셀 생성 헬퍼 함수
        function createDayCell(dayNum, isOtherMonth, year, month) {
            const cell = document.createElement("div");
            cell.className = `day-cell ${isOtherMonth ? 'other-month' : ''}`;
            
            const numberDiv = document.createElement("div");
            numberDiv.className = "day-number";
            numberDiv.textContent = dayNum;
            cell.appendChild(numberDiv);

            if (!isOtherMonth) {
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                
                // 음력 간이 표시 (예시용 텍스트)
                const lunarDiv = document.createElement("div");
                lunarDiv.className = "lunar-info";
                lunarDiv.textContent = "음력 " + ((dayNum % 30) + 1); // 간이 음력 데이터 표현
                cell.appendChild(lunarDiv);

                // 저장된 일정이 있다면 배지로 표시
                if (events[dateKey]) {
                    const eventBadge = document.createElement("div");
                    eventBadge.className = "event-badge";
                    eventBadge.textContent = events[dateKey];
                    cell.appendChild(eventBadge);
                }

                // 날짜 클릭 시 일정 입력 기능
                cell.onclick = function() {
                    const inputTitle = prompt(`${year}년 ${month + 1}월 ${dayNum}일의 일정을 입력하세요:`, events[dateKey] || "");
                    if (inputTitle !== null) {
                        if (inputTitle.trim() === "") {
                            delete events[dateKey];
                        } else {
                            events[dateKey] = inputTitle;
                        }
                        localStorage.setItem('calendar_events', JSON.stringify(events));
                        renderCalendar();
                    }
                };
            }

            return cell;
        }

        // 월 변경 함수
        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }
    </script>
</body>
</html>
