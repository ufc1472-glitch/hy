<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO 스마트 달력</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Malgun Gothic', -apple-system, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .calendar-container { background: #ffffff; width: 100%; max-width: 800px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    .header-status { background: #edf2f7; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .status-text { font-size: 13px; font-weight: bold; color: #4a5568; }
    .btn-login { background: #3182ce; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-logout { background: #e53e3e; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; }

    .title-area { text-align: center; margin-bottom: 15px; }
    .title-area h2 { margin: 0; font-size: 24px; color: #1a202c; font-weight: bold; }

    .nav-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .nav-btn { background: #edf2f7; border: 1px solid #cbd5e0; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .current-month { font-size: 20px; font-weight: bold; color: #2d3748; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .day-header { font-weight: bold; padding: 8px 0; font-size: 14px; }
    .day-header.sun { color: #e53e3e; }
    .day-header.sat { color: #3182ce; }
    
    .date-cell { min-height: 90px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 4px; background: white; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-start; text-align: left; }
    .date-cell:hover { background: #ebf8ff; }

    .date-header-row { display: flex; align-items: baseline; justify-content: flex-start; gap: 4px; }
    .date-num { font-size: 15px; font-weight: bold; }
    .sun .date-num, .holiday .date-num { color: #e53e3e; }
    .sat .date-num { color: #3182ce; }

    .solar-term { font-size: 10px; color: #2f855a; background: #c6f6d5; padding: 1px 3px; border-radius: 3px; margin-top: 2px; width: fit-content; }
    .holiday-tag { font-size: 10px; color: #9b2c2c; background: #fed7d7; padding: 1px 3px; border-radius: 3px; margin-top: 2px; width: fit-content; font-weight: bold; }
    .event-item { background: #ccfbf1; color: #0f766e; font-size: 11px; padding: 2px 4px; border-radius: 4px; margin-top: 2px; text-align: left; font-weight: bold; }
  </style>
</head>
<body>

<div class="calendar-container">
  <div class="header-status">
    <span id="status-text" class="status-text">🔒 동기화 미연결 (구글 로그인 시 폰과 실시간 연동)</span>
    <button id="btn-login" class="btn-login" onclick="handleLogin()">구글 계정 로그인</button>
    <button id="btn-logout" class="btn-logout" onclick="handleLogout()">로그아웃</button>
  </div>

  <div class="title-area">
    <h2>PRO 스마트 달력</h2>
  </div>

  <div class="nav-area">
    <button class="nav-btn" onclick="changeMonth(-1)">◀ 이전달</button>
    <span id="month-title" class="current-month">2026년 10월</span>
    <button class="nav-btn" onclick="changeMonth(1)">다음달 ▶</button>
  </div>

  <div class="calendar-grid">
    <div class="day-header sun">일</div>
    <div class="day-header">월</div>
    <div class="day-header">화</div>
    <div class="day-header">수</div>
    <div class="day-header">목</div>
    <div class="day-header">금</div>
    <div class="day-header sat">토</div>
  </div>
  <div id="calendar-days" class="calendar-grid"></div>
</div>

<script>
  // Firebase 설정 (Project: my-calendar-2b531)
  const firebaseConfig = {
    apiKey: "AIzaSyDTOKW3Y3pEFikEMBQllyn46wP3_XInJhM",
    authDomain: "my-calendar-2b531.firebaseapp.com",
    projectId: "my-calendar-2b531",
    storageBucket: "my-calendar-2b531.firebasestorage.app",
    messagingSenderId: "391516744396",
    appId: "1:391516744396:web:214d5afeae8474df76b069"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentDate = new Date(2026, 9, 1);
  let currentUser = null;
  let userEvents = {};

  // 2026년 전체 24절기 및 주요 공휴일 데이터
  const fixedInfo = {
    "2026-01-01": { holiday: "신정" },
    "2026-01-05": { term: "소한" },
    "2026-01-20": { term: "대한" },
    "2026-02-04": { term: "입춘" },
    "2026-02-16": { holiday: "설날 연휴" },
    "2026-02-17": { holiday: "설날" },
    "2026-02-18": { holiday: "설날 연휴" },
    "2026-02-19": { term: "우수" },
    "2026-03-01": { holiday: "삼일절" },
    "2026-03-02": { holiday: "대체공휴일" },
    "2026-03-06": { term: "경칩" },
    "2026-03-21": { term: "춘분" },
    "2026-04-05": { term: "청명" },
    "2026-04-20": { term: "곡우" },
    "2026-05-05": { holiday: "어린이날", term: "입하" },
    "2026-05-21": { term: "소만" },
    "2026-05-24": { holiday: "부처님오신날" },
    "2026-05-25": { holiday: "대체공휴일" },
    "2026-06-06": { holiday: "현충일", term: "망종" },
    "2026-06-21": { term: "하지" },
    "2026-07-07": { term: "소서" },
    "2026-07-15": { term: "초복" },
    "2026-07-23": { term: "대서" },
    "2026-07-25": { term: "중복" },
    "2026-08-07": { term: "입추" },
    "2026-08-14": { term: "말복" },
    "2026-08-15": { holiday: "광복절" },
    "2026-08-23": { term: "처서" },
    "2026-09-07": { term: "백로" },
    "2026-09-23": { term: "추분" },
    "2026-09-24": { holiday: "추석 연휴" },
    "2026-09-25": { holiday: "추석" },
    "2026-09-26": { holiday: "추석 연휴" },
    "2026-10-03": { holiday: "개천절" },
    "2026-10-08": { term: "한로" },
    "2026-10-09": { holiday: "한글날" },
    "2026-10-23": { term: "상강" },
    "2026-11-07": { term: "입동" },
    "2026-11-22": { term: "소설" },
    "2026-12-07": { term: "대설" },
    "2026-12-22": { term: "동지" },
    "2026-12-25": { holiday: "성탄절" }
  };

  // 구글 로그인 동작 함수
  function handleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(error => {
      alert("로그인 중 오류가 발생했습니다: " + error.message);
    });
  }

  function handleLogout() {
    auth.signOut();
  }

  // 로그인 상태 동기화 감지
  auth.onAuthStateChanged(user => {
    currentUser = user;
    const statusText = document.getElementById("status-text");
    const btnLogin = document.getElementById("btn-login");
    const btnLogout = document.getElementById("btn-logout");

    if (user) {
      statusText.innerText = "☁️ 동기화 완료 (" + user.displayName + "님)";
      btnLogin.style.display = "none";
      btnLogout.style.display = "inline-block";
      loadUserEvents();
    } else {
      statusText.innerText = "🔒 동기화 미연결 (구글 로그인 시 실시간 연동)";
      btnLogin.style.display = "inline-block";
      btnLogout.style.display = "none";
      userEvents = {};
      renderCalendar();
    }
  });

  function changeMonth(diff) {
    currentDate.setMonth(currentDate.getMonth() + diff);
    renderCalendar();
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("month-title").innerText = `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const calendarDays = document.getElementById("calendar-days");
    calendarDays.innerHTML = "";

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement("div");
      emptyCell.className = "date-cell";
      calendarDays.appendChild(emptyCell);
    }

    for (let date = 1; date <= lastDate; date++) {
      const cell = document.createElement("div");
      const dayOfWeek = (firstDay + date - 1) % 7;
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
      
      let dayClass = "date-cell";
      if (dayOfWeek === 0) dayClass += " sun";
      if (dayOfWeek === 6) dayClass += " sat";

      const info = fixedInfo[dateStr] || {};
      if (info.holiday) dayClass += " holiday";

      cell.className = dayClass;

      let extraHtml = "";
      if (info.holiday) extraHtml += `<div class="holiday-tag">🔴 ${info.holiday}</div>`;
      if (info.term) extraHtml += `<div class="solar-term">🥬 ${info.term}</div>`;
      if (userEvents[dateStr]) extraHtml += `<div class="event-item">📌 ${userEvents[dateStr]}</div>`;

      cell.innerHTML = `
        <div class="date-header-row">
          <span class="date-num">${date}</span>
        </div>
        ${extraHtml}
      `;

      cell.onclick = () => addEvent(dateStr);
      calendarDays.appendChild(cell);
    }
  }

  function addEvent(dateStr) {
    if (!currentUser) {
      alert("일정을 저장하려면 상단의 [구글 계정 로그인]을 먼저 진행해 주세요!");
      return;
    }
    const memo = prompt(`${dateStr} 일정을 입력하세요:`, userEvents[dateStr] || "");
    if (memo !== null) {
      if (memo.trim() === "") {
        delete userEvents[dateStr];
      } else {
        userEvents[dateStr] = memo.trim();
      }
      db.collection("users").doc(currentUser.uid).set({ events: userEvents }, { merge: true })
        .then(() => { renderCalendar(); });
    }
  }

  function loadUserEvents() {
    if (!currentUser) return;
    db.collection("users").doc(currentUser.uid).get().then(doc => {
      if (doc.exists && doc.data().events) {
        userEvents = doc.data().events;
      }
      renderCalendar();
    });
  }

  renderCalendar();
</script>
</body>
</html>
