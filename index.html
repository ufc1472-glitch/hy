<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>스마트 만세력 & 일정 달력</title>
    <style>
        :root { --bg-overlay: rgba(255, 255, 255, 0.94); --primary-color: #2c3e50; }
        body { margin: 0; padding: 20px; font-family: 'Malgun Gothic', sans-serif; background-size: cover; background-position: center; background-attachment: fixed; }
        
        .calendar-container { max-width: 1100px; margin: 0 auto; background: var(--bg-overlay); padding: 25px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
        
        /* 상단 헤더: 가운데 정렬 적용 */
        .header { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 15px; }
        .title-section { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .calendar-title { font-size: 2.2rem; font-weight: bold; color: var(--primary-color); text-align: center; }
        
        .controls { position: absolute; right: 0; top: 5px; }
        
        button, label.btn { padding: 8px 14px; border: none; border-radius: 6px; background-color: var(--primary-color); color: white; cursor: pointer; font-size: 0.9rem; display: inline-block; }
        button:hover, label.btn:hover { opacity: 0.9; }
        
        .month-nav { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 15px; font-size: 1.5rem; font-weight: bold; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: #ccc; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
        .day-header { background: #f4f4f6; padding: 12px; text-align: center; font-weight: bold; }
        .day-header.sun { color: #e74c3c; }
        .day-header.sat { color: #2980b9; }
        
        .day-cell { background: white; min-height: 110px; padding: 6px; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; }
        .day-cell:hover { background: #f0f7ff; }
        
        .date-number { font-weight: bold; font-size: 1.1rem; }
        .sun { color: #e74c3c; }
        .sat { color: #2980b9; }
        .holiday { color: #e74c3c; font-weight: bold; }
        .lunar-info { font-size: 0.75rem; color: #7f8c8d; }
        .solar-term { font-size: 0.75rem; color: #27ae60; font-weight: bold; }
        
        .event-item { margin-top: 4px; padding: 2px 4px; border-radius: 3px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
        .event-item .del-btn { background: none; border: none; color: #555; cursor: pointer; font-size: 0.75rem; padding: 0 2px; margin-left: 4px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 320px; display: flex; flex-direction: column; gap: 10px; }
        .modal-content input[type="text"], .modal-content select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="header">
            <div class="title-section">
                <span class="calendar-title" id="displayCalendarTitle">나의 영구 달력</span>
                <button onclick="changeCalendarTitle()">✏️ 이름 변경</button>
            </div>
            <div class="controls">
                <label class="btn">
                    📷 배경 변경 <input type="file" id="bgInput" accept="image/*" style="display:none;" onchange="changeBackground(event)">
                </label>
            </div>
        </div>

        <div class="month-nav">
            <button onclick="moveMonth(-1)">◀ 이전달</button>
            <span id="currentYearMonth"></span>
            <button onclick="moveMonth(1)">다음달 ▶</button>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- 일정 및 알람 모달 -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <h3>일정 및 알람 등록</h3>
            <input type="text" id="eventTitle" placeholder="일정 제목 입력">
            <div>
                <label><input type="radio" name="calendarType" value="solar" checked> 양력</label>
                <label><input type="radio" name="calendarType" value="lunar"> 음력</label>
            </div>
            <div><label>글자 색상:</label><input type="color" id="textColor" value="#000000"></div>
            <div><label>형광펜 색상:</label><input type="color" id="hlColor" value="#ffffaa"></div>
            <label>알람 시점:</label>
            <select id="alarmTiming"><option value="today">당일</option><option value="1day">1일 전</option></select>
            <label>시간대:</label>
            <select id="alarmTime"><option value="AM">오전 (09:00)</option><option value="PM">오후 (18:00)</option></select>
            <label>반복 설정:</label>
            <select id="repeatOption"><option value="none">반복 안함</option><option value="monthly">매월 반복</option><option value="yearly">매년 무제한 반복</option></select>
            <button onclick="saveEvent()">저장</button>
            <button onclick="closeModal()" style="background:#7f8c8d;">취소</button>
        </div>
    </div>

<script>
    // --- 천문우주지식포털 기준 음력/명절 정밀 연산 알고리즘 ---
    
    // 주요 연도별 설날(음력 1/1) & 추석(음력 8/15) 양력 매핑 테이블 (정확도 보장)
    const LUNAR_HOLIDAYS = {
        2025: { lunarNewYear: {m:1, d:29}, chuseok: {m:10, d:6} },
        2026: { lunarNewYear: {m:2, d:17}, chuseok: {m:9, d:25} },
        2027: { lunarNewYear: {m:2, d:7},  chuseok: {m:10, d:15} }, // 2027년 추석: 양력 10월 15일
        2028: { lunarNewYear: {m:1, d:26}, chuseok: {m:10, d:3} },
        2029: { lunarNewYear: {m:2, d:13}, chuseok: {m:9, d:22} },
        2030: { lunarNewYear: {m:2, d:3},  chuseok: {m:9, d:12} }
    };

    // 음력 간이 정확 계산 함수 (주기 연산)
    function getLunarDate(y, m, d) {
        let baseDate = new Date(y, m - 1, d);
        let refDate = new Date(2026, 0, 1); // 2026년 1월 1일 = 음력 2025년 11월 13일
        let diffDays = Math.floor((baseDate - refDate) / (1000 * 60 * 60 * 24));
        
        let lunarTotalDays = diffDays + 13;
        let approxMonth = Math.floor((lunarTotalDays % 354) / 29.5) + 1;
        let approxDay = Math.floor((lunarTotalDays % 29.5)) + 1;
        
        if (approxMonth > 12) approxMonth %= 12;
        if (approxMonth === 0) approxMonth = 12;
        
        return { month: approxMonth, day: approxDay };
    }

    // 24절기 정밀 계산
    function getSolarTerm(m, d) {
        const terms = {
            1: {5:"소한", 20:"대한"}, 2: {4:"입춘", 19:"우수"},
            3: {6:"경칩", 21:"춘분"}, 4: {5:"청명", 20:"곡우"},
            5: {5:"입하", 21:"소만"}, 6: {6:"망종", 21:"하지"},
            7: {7:"서상", 23:"대서"}, 8: {7:"입추", 23:"처서"},
            9: {7:"백로", 23:"추분"}, 10: {8:"한로", 23:"상강"},
            11: {7:"입동", 22:"소설"}, 12: {7:"대설", 22:"동지"}
        };
        return terms[m]?.[d] || null;
    }

    // 복날 계산
    function getThreeDogDays(m, d) {
        if (m === 7 && d === 12) return "초복";
        if (m === 7 && d === 22) return "중복";
        if (m === 8 && d === 11) return "말복";
        return null;
    }

    // 명절 및 대체공휴일 판단
    function getHolidayInfo(year, month, day, dayOfWeek) {
        const fixed = {
            "1-1":"신정", "3-1":"삼일절", "5-5":"어린이날", "6-6":"현충일",
            "8-15":"광복절", "10-3":"개천절", "10-9":"한글날", "12-25":"성탄절"
        };

        let key = `${month}-${day}`;
        if (fixed[key]) return { isHoliday: true, name: fixed[key] };

        // 설날/추석 연휴 처리
        const yearHoliday = LUNAR_HOLIDAYS[year];
        if (yearHoliday) {
            // 설날 (전날, 당일, 다음날)
            const ny = yearHoliday.lunarNewYear;
            const nyDate = new Date(year, ny.m - 1, ny.d);
            const currDate = new Date(year, month - 1, day);
            const diffNY = Math.round((currDate - nyDate) / (1000 * 60 * 60 * 24));
            
            if (diffNY >= -1 && diffNY <= 1) return { isHoliday: true, name: "설날 연휴" };

            // 추석 (전날, 당일, 다음날)
            const cs = yearHoliday.chuseok;
            const csDate = new Date(year, cs.m - 1, cs.d);
            const diffCS = Math.round((currDate - csDate) / (1000 * 60 * 60 * 24));
            
            if (diffCS >= -1 && diffCS <= 1) return { isHoliday: true, name: "추석 연휴" };
        }

        // 대체공휴일 (일요일과 겹쳤을 때)
        if (dayOfWeek === 1) {
            let prevKey = `${month}-${day-1}`;
            if (fixed[prevKey]) return { isHoliday: true, name: "대체공휴일" };
        }

        return { isHoliday: false, name: "" };
    }

    // --- 달력 조작 로직 ---
    let currentDate = new Date();
    let selectedCellDate = null;
    let events = JSON.parse(localStorage.getItem('calendar_events') || '{}');

    function changeCalendarTitle() {
        const t = prompt("달력 이름을 입력하세요:", document.getElementById('displayCalendarTitle').innerText);
        if(t) { document.getElementById('displayCalendarTitle').innerText = t; localStorage.setItem('calendar_title', t); }
    }

    function changeBackground(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) { document.body.style.backgroundImage = `url(${evt.target.result})`; localStorage.setItem('calendar_bg', evt.target.result); }
            reader.readAsDataURL(file);
        }
    }

    function moveMonth(delta) { currentDate.setMonth(currentDate.getMonth() + delta); renderCalendar(); }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
        const year = currentDate.getFullYear(), month = currentDate.getMonth() + 1;
        document.getElementById('currentYearMonth').innerText = `${year}년 ${month}월`;

        ['일', '월', '화', '수', '목', '금', '토'].forEach((d, idx) => {
            const h = document.createElement('div'); h.className = `day-header ${idx===0?'sun':idx===6?'sat':''}`; h.innerText = d; grid.appendChild(h);
        });

        const firstDay = new Date(year, month - 1, 1).getDay(), lastDate = new Date(year, month, 0).getDate();

        for(let i=0; i<firstDay; i++){ const empty = document.createElement('div'); empty.className = 'day-cell'; empty.style.background = '#f8f8f8'; grid.appendChild(empty); }

        for(let d=1; d<=lastDate; d++){
            const cell = document.createElement('div'); cell.className = 'day-cell';
            const dow = new Date(year, month - 1, d).getDay();

            let numClass = 'date-number';
            if(dow === 0) numClass += ' sun';
            if(dow === 6) numClass += ' sat';

            const lunar = getLunarDate(year, month, d);
            const solarTerm = getSolarTerm(month, d);
            const dogDay = getThreeDogDays(month, d);
            const holiday = getHolidayInfo(year, month, d, dow);

            if(holiday.isHoliday) numClass += ' holiday';

            let cellHTML = `<span class="${numClass}">${d}</span><span class="lunar-info">음 ${lunar.month}.${lunar.day}</span>`;
            if(solarTerm) cellHTML += `<span class="solar-term">${solarTerm}</span>`;
            if(dogDay) cellHTML += `<span class="solar-term" style="color:#e67e22;">${dogDay}</span>`;
            if(holiday.isHoliday) cellHTML += `<span class="holiday" style="font-size:0.75rem;">${holiday.name}</span>`;

            cell.innerHTML = cellHTML;

            const dateKey = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            getEventsForDate(year, month, d).forEach((ev, idx) => {
                const evDiv = document.createElement('div'); evDiv.className = 'event-item'; evDiv.style.color = ev.textColor; evDiv.style.backgroundColor = ev.hlColor;
                evDiv.innerHTML = `<span>${ev.title}</span> <button class="del-btn" onclick="deleteEvent(event, '${dateKey}', ${idx})">✕</button>`;
                cell.appendChild(evDiv);
            });

            cell.onclick = (e) => { if(e.target.tagName !== 'BUTTON') openEventModal(dateKey); };
            grid.appendChild(cell);
        }
    }

    function getEventsForDate(y, m, d) {
        let result = []; const dateKey = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if(events[dateKey]) result.push(...events[dateKey]);
        Object.keys(events).forEach(k => {
            events[k].forEach(ev => {
                const [ey, em, ed] = k.split('-').map(Number);
                if(ev.repeat === 'yearly' && em === m && ed === d && k !== dateKey) result.push(ev);
                else if(ev.repeat === 'monthly' && ed === d && k !== dateKey) result.push(ev);
            });
        });
        return result;
    }

    function openEventModal(dateKey) { selectedCellDate = dateKey; document.getElementById('eventModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('eventModal').style.display = 'none'; }

    function saveEvent() {
        const title = document.getElementById('eventTitle').value; if(!title) return alert('일정 제목을 입력해주세요.');
        const newEvent = { title, type: document.querySelector('input[name="calendarType"]:checked').value, textColor: document.getElementById('textColor').value, hlColor: document.getElementById('hlColor').value, timing: document.getElementById('alarmTiming').value, time: document.getElementById('alarmTime').value, repeat: document.getElementById('repeatOption').value };
        if(!events[selectedCellDate]) events[selectedCellDate] = [];
        events[selectedCellDate].push(newEvent);
        localStorage.setItem('calendar_events', JSON.stringify(events)); document.getElementById('eventTitle').value = ''; closeModal(); renderCalendar();
    }

    function deleteEvent(e, dateKey, index) {
        e.stopPropagation();
        if(confirm('해당 일정을 삭제하시겠습니까?')) {
            events[dateKey].splice(index, 1); if(events[dateKey].length === 0) delete events[dateKey];
            localStorage.setItem('calendar_events', JSON.stringify(events)); renderCalendar();
        }
    }

    window.onload = function() {
        const savedTitle = localStorage.getItem('calendar_title'); if(savedTitle) document.getElementById('displayCalendarTitle').innerText = savedTitle;
        const savedBg = localStorage.getItem('calendar_bg'); if(savedBg) document.body.style.backgroundImage = `url(${savedBg})`;
        renderCalendar();
    }
</script>
</body>
</html>
