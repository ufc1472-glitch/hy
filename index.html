<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 동기화 달력</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔥 보내주신 화면의 설정값으로 채워 넣은 코드입니다.
        const firebaseConfig = {
            apiKey: "AIzaSyDTOKW3Y3pEFikEMBQllyn46wP3_XInJhM",
            authDomain: "my-calendar-2b531.firebaseapp.com",
            projectId: "my-calendar-2b531",
            storageBucket: "my-calendar-2b531.firebasestorage.app",
            messagingSenderId: "391516744396",
            appId: "1:391516744396:web:214d5afeae8474df76b069"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();

        // 구글 로그인 버튼 이벤트
        window.toggleLogin = function() {
            if (!currentUser) {
                signInWithPopup(auth, provider).catch((error) => {
                    console.error("로그인 실패:", error);
                });
            } else {
                signOut(auth).catch((error) => {
                    console.error("로그아웃 실패:", error);
                });
            }
        };

        // 인증 상태 감지
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const loginBtn = document.getElementById('loginBtn');
            const userSpan = document.getElementById('userInfo');

            if (user) {
                loginBtn.innerText = "로그아웃";
                userSpan.innerText = `${user.displayName}님 환영합니다.`;
                loadEventsFromCloud();
            } else {
                loginBtn.innerText = "구글 로그인";
                userSpan.innerText = "로그인이 필요합니다.";
                document.getElementById('calendar-body').innerHTML = "";
            }
        });

        // 캘린더 렌더링 함수
        window.renderCalendar = function() {
            const title = document.getElementById('calendar-title');
            title.innerText = `${currentYear}년 ${currentMonth + 1}월`;
            
            const body = document.getElementById('calendar-body');
            body.innerHTML = "";

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();

            let row = document.createElement('tr');
            for (let i = 0; i < firstDay; i++) {
                row.appendChild(document.createElement('td'));
            }

            for (let day = 1; day <= lastDate; day++) {
                if (row.children.length === 7) {
                    body.appendChild(row);
                    row = document.createElement('tr');
                }

                const cell = document.createElement('td');
                cell.className = "border h-24 p-1 align-top relative cursor-pointer hover:bg-gray-50";
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                cell.innerHTML = `<div class="font-bold text-sm">${day}</div><div id="events-${dateStr}" class="text-xs space-y-1 mt-1 overflow-y-auto max-h-16"></div>`;
                
                cell.onclick = () => openEventModal(dateStr);
                row.appendChild(cell);
            }
            body.appendChild(row);
            if (currentUser) loadEventsFromCloud();
        };

        window.changeMonth = function(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        };

        // 일정 모달 제어
        let selectedDateStr = "";
        window.openEventModal = function(dateStr) {
            if (!currentUser) {
                alert("일정을 추가하려면 구글 로그인이 필요합니다.");
                return;
            }
            selectedDateStr = dateStr;
            document.getElementById('modalDate').innerText = dateStr;
            document.getElementById('eventModal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('eventModal').classList.add('hidden');
            document.getElementById('eventText').value = "";
        };

        // 클라우드(Firestore)에 일정 저장
        window.saveEvent = async function() {
            const text = document.getElementById('eventText').value;
            if (!text) return;

            const eventId = `${selectedDateStr}_${Date.now()}`;
            try {
                await setDoc(doc(db, "events", eventId), {
                    uid: currentUser.uid,
                    date: selectedDateStr,
                    text: text,
                    createdAt: Date.now()
                });
                closeModal();
                loadEventsFromCloud();
            } catch (e) {
                console.error("저장 오류:", e);
            }
        };

        // 클라우드에서 일정 불러오기
        async function loadEventsFromCloud() {
            if (!currentUser) return;

            document.querySelectorAll("[id^='events-']").forEach(el => el.innerHTML = "");

            try {
                const q = query(collection(db, "events"), where("uid", "==", currentUser.uid));
                const querySnapshot = await getDocs(q);
                
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const container = document.getElementById(`events-${data.date}`);
                    if (container) {
                        const div = document.createElement('div');
                        div.className = "bg-blue-100 text-blue-800 rounded px-1 truncate flex justify-between items-center";
                        div.innerHTML = `<span>${data.text}</span><button onclick="deleteEvent(event, '${docSnap.id}')" class="text-red-500 font-bold ml-1">×</button>`;
                        container.appendChild(div);
                    }
                });
            } catch (e) {
                console.error("불러오기 오류:", e);
            }
        }

        // 일정 삭제
        window.deleteEvent = async function(e, docId) {
            e.stopPropagation();
            if (confirm("일정을 삭제하시겠습니까?")) {
                try {
                    await deleteDoc(doc(db, "events", docId));
                    loadEventsFromCloud();
                } catch (err) {
                    console.error("삭제 오류:", err);
                }
            }
        }

        window.onload = () => {
            renderCalendar();
        };
    </script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow p-6">
        <!-- 상단 로그인 및 컨트롤 바 -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <span id="userInfo" class="text-sm text-gray-600 mr-4">로그인이 필요합니다.</span>
                <button id="loginBtn" onclick="toggleLogin()" class="bg-red-500 text-white px-4 py-2 rounded text-sm hover:bg-red-600">구글 로그인</button>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="changeMonth(-1)" class="bg-gray-200 px-3 py-1 rounded">&lt;</button>
                <h2 id="calendar-title" class="text-xl font-bold"></h2>
                <button onclick="changeMonth(1)" class="bg-gray-200 px-3 py-1 rounded">&gt;</button>
            </div>
        </div>

        <!-- 달력 테이블 -->
        <table class="w-full border-collapse">
            <thead>
                <tr class="bg-gray-200 text-center">
                    <th class="border p-2 text-red-600">일</th>
                    <th class="border p-2">월</th>
                    <th class="border p-2">화</th>
                    <th class="border p-2">수</th>
                    <th class="border p-2">목</th>
                    <th class="border p-2">금</th>
                    <th class="border p-2 text-blue-600">토</th>
                </tr>
            </thead>
            <tbody id="calendar-body">
                <!-- 동적 생성 -->
            </tbody>
        </table>
    </div>

    <!-- 일정 입력 모달 -->
    <div id="eventModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-lg w-80 shadow-lg">
            <h3 id="modalDate" class="font-bold text-lg mb-3"></h3>
            <input type="text" id="eventText" placeholder="일정 내용을 입력하세요" class="w-full border p-2 rounded mb-4">
            <div class="flex justify-end space-x-2">
                <button onclick="closeModal()" class="bg-gray-300 px-4 py-2 rounded">취소</button>
                <button onclick="saveEvent()" class="bg-blue-500 text-white px-4 py-2 rounded">저장</button>
            </div>
        </div>
    </div>
</body>
</html>
