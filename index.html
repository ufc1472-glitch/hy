<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 만세력 달력</title>

    <style>
        :root { --primary-color: #2c3e50; }
        body { 
            margin: 0; 
            padding: 15px; 
            font-family: 'Malgun Gothic', sans-serif; 
            background-color: #f0f2f5; 
        }

        .sync-bar {
            background-color: #2c3e50; color: white; text-align: center; padding: 6px;
            font-size: 0.85rem; border-radius: 6px; margin-bottom: 10px; display: flex;
            justify-content: center; align-items: center; gap: 10px;
            position: relative; z-index: 2;
        }
        .sync-status { font-weight: bold; color: #2ecc71; }

        .calendar-container { 
            max-width: 1100px; 
            margin: 0 auto; 
            background-color: #ffffff; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.15); 
            position: relative;
            overflow: hidden;
            min-height: 650px;
            /* 배경 이미지 속성 직접 지정 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .header, .month-nav, .calendar-grid {
            position: relative;
            z-index: 1;
        }

        .header { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 15px; border-bottom: 2px solid rgba(0,0,0,0.1); padding-bottom: 15px; }
        .title-section { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .calendar-title { font-size: 2rem; font-weight: bold; color: var(--primary-color); text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff, 0 0 10px #fff; }
        .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }

        button, label.btn { padding: 8px 12px; border: none; border-radius: 6px; background-color: var(--primary-color); color: white; cursor: pointer; font-size: 0.85rem; }
        button:hover, label.btn:hover { opacity: 0.9; }

        .month-nav { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 15px 0; font-size: 1.4rem; font-weight: bold; text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff, 0 0 8px #fff; }
        
        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 2px; 
            background: rgba(0, 0, 0, 0.1); 
            border: 1px solid rgba(200, 200, 200, 0.5); 
            border-radius: 8px; 
            overflow: hidden; 
        }
        .day-header { background: rgba(255, 255, 255, 0.85); padding: 10px; text-align: center; font-weight: bold; }
        .day-header.sun { color: #e74c3c; } .day-header.sat { color: #2980b9; }

        .day-cell { 
            background: rgba(255, 255, 255, 0.7); 
            min-height: 105px; 
            padding: 6px; 
            box-sizing: border-box; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
        }
        .day-cell:hover { background: rgba(255, 255, 255, 0.9); }

        .day-cell.today-cell {
            background-color: rgba(240, 248, 255, 0.85) !important;
            border: 3px solid #00e5ff !important;
            box-shadow: inset 0 0 6px rgba(0, 229, 255, 0.5), 0 0 8px rgba(0, 229, 255, 0.6);
            z-index: 2;
        }

        .date-number { font-weight: bold; font-size: 1rem; text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 0 6px #fff; color: #000; }
        .sun { color: #e74c3c !important; } .sat { color: #2980b9 !important; } .holiday { color: #e74c3c !important; font-weight: bold; }
        .lunar-info { font-size: 0.75rem; color: #000; text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 0 4px #fff; font-weight: 600; }
        .solar-term { font-size: 0.75rem; color: #1e824c; font-weight: bold; text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 0 4px #fff; }

        .event-item { margin-top: 3px; padding: 2px 4px; border-radius: 3px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
        .event-item .del-btn { background: none; border: none; color: #555; cursor: pointer; font-size: 0.75rem; padding: 0 2px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 320px; display: flex; flex-direction: column; gap: 8px; }
        .modal-content input[type="text"], .modal-content select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="calendar-container" id="calendarContainer">
        <div class="sync-bar">
            <span>🌐 어디서나 자동 동기화 중</span>
            <span id="syncStatus" class="sync-status">● 연결됨</span>
            <button onclick="loadCloudData()" style="padding:2px 8px; font-size:0.75rem; background:#34495e;">🔄 새로고침</button>
        </div>

        <div class="header">
            <div class="title-section">
                <span class="calendar-title" id="displayCalendarTitle">나의 영구 달력</span>
                <button onclick="changeCalendarTitle()">✏️ 이름 변경</button>
            </div>
            <div class="controls">
                <label class="btn">📷 배경 변경 <input type="file" id="bgFileInput" accept="image/*" style="display:none;" onchange="changeBackground(event)"></label>
                <button onclick="resetBackground()" style="background:#e74c3c;">🗑️ 배경 삭제</button>
            </div>
        </div>

        <div class="month-nav">
            <button onclick="moveMonth(-1)">◀ 이전달</button>
            <span id="currentYearMonth"></span>
            <button onclick="moveMonth(1)">다음달 ▶</button>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="modal" id="eventModal">
        <div class="modal-content">
            <h3>일정 및 알람 등록</h3>
            <input type="text" id="eventTitle" placeholder="일정 제목 입력">
            <div>
                <label><input type="radio" name="calendarType" value="solar" checked> 양력</label>
                <label><input type="radio" name="calendarType" value="lunar"> 음력</label>
            </div>
            <div><label>글자 색상:</label><input type="color" id="textColor" value="#000000"></div>
            <div><label>형광펜 색상:</label><input type="color" id="hlColor" value="#ffffaa"></div>
            <label>알람 시점:</label>
            <select id="alarmTiming"><option value="today">당일</option><option value="1day">1일 전</option></select>
            <label>시간대:</label>
            <select id="alarmTime"><option value="AM">오전 (09:00)</option><option value="PM">오후 (18:00)</option></select>
            <label>반복 설정:</label>
            <select id="repeatOption">
                <option value="none">반복 안함</option>
                <option value="monthly">매월 반복</option>
                <option value="yearly">매년 무제한 반복</option>
            </select>
            <button onclick="saveEvent()">저장</button>
            <button onclick="closeModal()" style="background:#7f8c8d;">취소</button>
        </div>
    </div>

<script>
    const BIN_ID = "66d5b085e41b4d34e427d19a";
    const API_KEY = "$2a$10$7Z8.45KOn04z.Pj.B3H4s.9k78H4P0Yp7E1A7P6P5X6G7H8I9J0K1"; 
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    const FIXED_HOLIDAYS = {
        "1-1": "신정", "3-1": "삼일절", "5-5": "어린이날", "6-6": "현충일",
        "8-15": "광복절", "10-3": "개천절", "10-9": "한글날", "12-25": "성탄절"
    };

    const SPECIAL_HOLIDAYS = {
        "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴",
        "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴",
        "2027-02-05": "설날 연휴", "2027-02-06": "설날", "2027-02-07": "설날 연휴", "2027-02-08": "대체공휴일",
        "2027-09-14": "추석 연휴", "2027-09-15": "추석", "2027-09-16": "추석 연휴",
        "2028-01-26": "설날 연휴", "2028-01-27": "설날", "2028-01-28": "설날 연휴",
        "2028-10-02": "추석 연휴", "2028-10-03": "추석", "2028-10-04": "추석 연휴", "2028-10-05": "대체공휴일"
    };

    function getLunarDateStr(y, m, d) {
        let current = new Date(y, m - 1, d);
        let refDate = new Date(2028, 0, 27);
        let diffDays = Math.floor((current - refDate) / (1000 * 60 * 60 * 24));
        let lunarDate = new Date(2028, 0, 1 + diffDays);
        return `음 ${lunarDate.getMonth() + 1}.${lunarDate.getDate()}`;
    }

    function getSolarTerm(m, d) {
        const terms = {
            1: {5:"소한", 20:"대한"}, 2: {4:"입춘", 19:"우수"}, 3: {6:"경칩", 21:"춘분"}, 4: {5:"청명", 20:"곡우"},
            5: {5:"입하", 21:"소만"}, 6: {6:"망종", 21:"하지"}, 7: {7:"작서", 23:"대서"}, 8: {7:"입추", 23:"처서"},
            9: {7:"백로", 23:"추분"}, 10: {8:"한로", 23:"상강"}, 11: {7:"입동", 22:"소설"}, 12: {7:"대설", 22:"동지"}
        };
        return terms[m]?.[d] || null;
    }

    let currentDate = new Date();
    let selectedCellDate = null;
    let events = {};

    function loadCloudData() {
        document.getElementById('syncStatus').innerText = "🔄 동기화 중...";
        document.getElementById('syncStatus').style.color = "#f39c12";

        fetch(`${API_URL}/latest`, {
            headers: { "X-Master-Key": API_KEY }
        })
        .then(res => res.json())
        .then(data => {
            events = data.record.events || {};
            document.getElementById('syncStatus').innerText = "● 동기화 완료";
            document.getElementById('syncStatus').style.color = "#2ecc71";
            renderCalendar();
        })
        .catch(() => {
            const localData = localStorage.getItem('calendar_events');
            if(localData) events = JSON.parse(localData);
            document.getElementById('syncStatus').innerText = "● 오프라인 모드";
            document.getElementById('syncStatus').style.color = "#e74c3c";
            renderCalendar();
        });
    }

    function saveCloudData() {
        document.getElementById('syncStatus').innerText = "💾 저장 중...";
        localStorage.setItem('calendar_events', JSON.stringify(events));

        fetch(API_URL, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "X-Master-Key": API_KEY
            },
            body: JSON.stringify({ events: events })
        })
        .then(() => {
            document.getElementById('syncStatus').innerText = "● 동기화 완료";
            document.getElementById('syncStatus').style.color = "#2ecc71";
        })
        .catch(() => {
            document.getElementById('syncStatus').innerText = "⚠️ 저장 실패(로컬 저장됨)";
            document.getElementById('syncStatus').style.color = "#e74c3c";
        });
    }

    function changeCalendarTitle() {
        const t = prompt("달력 이름을 입력하세요:", document.getElementById('displayCalendarTitle').innerText);
        if(t) { document.getElementById('displayCalendarTitle').innerText = t; localStorage.setItem('calendar_title', t); }
    }

    // 수정된 배경 변경 함수 (직접 backgroundImage 적용)
    function changeBackground(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) { 
                const bgUrl = evt.target.result;
                const container = document.getElementById('calendarContainer');
                container.style.backgroundImage = `url('${bgUrl}')`;
                try {
                    localStorage.setItem('calendar_bg', bgUrl);
                } catch(err) {
                    console.warn("이미지 용량이 커서 브라우저 저장이 제한될 수 있습니다.");
                }
            }
            reader.readAsDataURL(file);
        }
    }

    // 수정된 배경 삭제 함수
    function resetBackground() {
        if(confirm("배경 이미지를 삭제(초기화)하시겠습니까?")) {
            const container = document.getElementById('calendarContainer');
            container.style.backgroundImage = 'none';
            container.style.backgroundColor = '#ffffff';
            localStorage.removeItem('calendar_bg');
            document.getElementById('bgFileInput').value = '';
        }
    }

    function moveMonth(delta) { currentDate.setMonth(currentDate.getMonth() + delta); renderCalendar(); }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
        const year = currentDate.getFullYear(), month = currentDate.getMonth() + 1;
        document.getElementById('currentYearMonth').innerText = `${year}년 ${month}월`;

        const today = new Date();
        const isCurrentMonth = today.getFullYear() === year && (today.getMonth() + 1) === month;
        const todayDate = today.getDate();

        ['일', '월', '화', '수', '목', '금', '토'].forEach((d, idx) => {
            const h = document.createElement('div'); h.className = `day-header ${idx===0?'sun':idx===6?'sat':''}`; h.innerText = d; grid.appendChild(h);
        });

        const firstDay = new Date(year, month - 1, 1).getDay(), lastDate = new Date(year, month, 0).getDate();
        for(let i=0; i<firstDay; i++){ const empty = document.createElement('div'); empty.className = 'day-cell'; empty.style.background = 'rgba(248,248,248,0.2)'; grid.appendChild(empty); }

        for(let d=1; d<=lastDate; d++){
            const cell = document.createElement('div'); cell.className = 'day-cell';
            const dow = new Date(year, month - 1, d).getDay();
            const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const shortKey = `${month}-${d}`;

            if (isCurrentMonth && d === todayDate) {
                cell.classList.add('today-cell');
            }

            let numClass = 'date-number'; 
            let holidayName = FIXED_HOLIDAYS[shortKey] || SPECIAL_HOLIDAYS[dateStr];

            if(dow === 0 || holidayName) numClass += ' sun'; 
            else if(dow === 6) numClass += ' sat';

            const lunarStr = getLunarDateStr(year, month, d);
            const solarTerm = getSolarTerm(month, d);

            let cellHTML = `<span class="${numClass}">${d}</span>`;
            cellHTML += `<span class="lunar-info">${lunarStr}</span>`;
            if(solarTerm) cellHTML += `<span class="solar-term">${solarTerm}</span>`;
            if(holidayName) cellHTML += `<span class="holiday" style="font-size:0.75rem; text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 0 4px #fff;">${holidayName}</span>`;

            cell.innerHTML = cellHTML;

            if(events[dateStr]) {
                events[dateStr].forEach((ev, idx) => {
                    const evDiv = document.createElement('div'); evDiv.className = 'event-item'; evDiv.style.color = ev.textColor; evDiv.style.backgroundColor = ev.hlColor;
                    evDiv.innerHTML = `<span>${ev.title}</span> <button class="del-btn" onclick="deleteEvent(event, '${dateStr}', ${idx})">✕</button>`;
                    cell.appendChild(evDiv);
                });
            }

            cell.onclick = (e) => { if(e.target.tagName !== 'BUTTON') openEventModal(dateStr); };
            grid.appendChild(cell);
        }
    }

    function openEventModal(dateKey) { selectedCellDate = dateKey; document.getElementById('eventModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('eventModal').style.display = 'none'; }

    function saveEvent() {
        const title = document.getElementById('eventTitle').value;
        if(!title) return alert('일정 제목을 입력해주세요.');

        const newEvent = {
            title,
            type: document.querySelector('input[name="calendarType"]:checked').value,
            textColor: document.getElementById('textColor').value,
            hlColor: document.getElementById('hlColor').value,
            timing: document.getElementById('alarmTiming').value,
            time: document.getElementById('alarmTime').value,
            repeat: document.getElementById('repeatOption').value
        };

        if(!events[selectedCellDate]) events[selectedCellDate] = [];
        events[selectedCellDate].push(newEvent);

        saveCloudData();
        document.getElementById('eventTitle').value = '';
        closeModal();
        renderCalendar();
    }

    function deleteEvent(e, dateKey, index) {
        e.stopPropagation();
        if(confirm('해당 일정을 삭제하시겠습니까?')) {
            events[dateKey].splice(index, 1);
            if(events[dateKey].length === 0) delete events[dateKey];
            saveCloudData();
            renderCalendar();
        }
    }

    window.onload = function() {
        const savedTitle = localStorage.getItem('calendar_title'); if(savedTitle) document.getElementById('displayCalendarTitle').innerText = savedTitle;
        const savedBg = localStorage.getItem('calendar_bg'); 
        if(savedBg) {
            document.getElementById('calendarContainer').style.backgroundImage = `url('${savedBg}')`;
        }
        loadCloudData();
        setInterval(loadCloudData, 10000);
    }
</script>
</body>
</html>
