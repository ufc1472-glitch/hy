<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>PRO 스마트 달력</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif; }
    
    body {
      background-color: #f0f4f8;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .calendar-container {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(5px);
      width: 100%;
      max-width: 900px;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .top-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 10px; 
      background: rgba(226, 232, 240, 0.85); 
      padding: 8px 12px; 
      border-radius: 8px; 
      flex-wrap: wrap;
      gap: 6px;
    }
    
    .status-text { font-size: 12px; font-weight: bold; color: #2d3748; }
    
    .btn-auth { 
      padding: 4px 10px; 
      border-radius: 5px; 
      font-size: 11px; 
      font-weight: bold; 
      border: none; 
      cursor: pointer; 
    }
    .btn-login { background: #3182ce; color: white; }
    .btn-logout { background: #e53e3e; color: white; display: none; }

    .control-btns button { 
      font-size: 11px; 
      padding: 4px 8px; 
      border-radius: 4px; 
      border: 1px solid #cbd5e0; 
      background: #ffffff; 
      cursor: pointer; 
      font-weight: bold;
    }

    .title-area { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 12px; }
    .title-area h2 { margin: 0; font-size: 20px; color: #1a202c; }
    .btn-edit-title { background: #edf2f7; border: 1px solid #cbd5e0; padding: 4px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; cursor: pointer; }

    .nav-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .nav-btn { background: #3182ce; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .current-month { font-size: 18px; font-weight: bold; color: #2d3748; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; width: 100%; text-align: center; }
    .day-header { font-weight: bold; padding: 6px 0; font-size: 13px; background: rgba(237, 242, 247, 0.9); border-radius: 4px; }
    .day-header.sun { color: #e53e3e; }
    .day-header.sat { color: #3182ce; }

    .date-cell {
      min-height: 85px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 3px;
      background: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      text-align: left;
      overflow: hidden;
    }
    .date-cell:hover { background: #ffffff; }

    .date-num-row { display: flex; align-items: baseline; gap: 3px; flex-wrap: wrap; margin-bottom: 2px; }
    .date-num { font-size: 14px; font-weight: bold; }
    .sun .date-num, .holiday .date-num { color: #e53e3e; }
    .sat .date-num { color: #3182ce; }
    .lunar-text { font-size: 10px; color: #718096; }

    .badge { font-size: 9px; padding: 1px 3px; border-radius: 3px; margin-top: 1px; display: inline-block; font-weight: bold; width: fit-content; white-space: nowrap; }
    .bg-holiday { background: #fed7d7; color: #9b2c2c; }
    .bg-term { background: #c6f6d5; color: #22543d; }
    .bg-bok { background: #feebc8; color: #7b341e; }

    .event-item {
      font-size: 11px;
      padding: 2px 4px;
      border-radius: 3px;
      margin-top: 2px;
      line-height: 1.2;
      font-weight: bold;
      word-break: break-all;
    }

    .hl-none { background: #edf2f7; }
    .hl-yellow { background: #fef08a; }
    .hl-mint { background: #ccfbf1; }
    .hl-pink { background: #fbcfe8; }
    .hl-blue { background: #bfdbfe; }
    .hl-orange { background: #fed7aa; }

    .fc-black { color: #1a202c; }
    .fc-red { color: #e53e3e; }
    .fc-blue { color: #2b6cb0; }
    .fc-green { color: #2f855a; }

    .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 16px; border-radius: 10px; width: 92%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
    .modal-content h3 { margin-top: 0; font-size: 16px; color: #2d3748; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #4a5568; }
    .form-group input, .form-group select { width: 100%; padding: 6px; border: 1px solid #cbd5e0; border-radius: 5px; font-size: 13px; }
    .form-row { display: flex; gap: 8px; }
    .form-row .form-group { flex: 1; }

    .modal-buttons { display: flex; justify-content: flex-end; gap: 6px; margin-top: 15px; }
    .btn { border: none; padding: 7px 14px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px; }
    .btn-save { background: #3182ce; color: white; }
    .btn-del { background: #e53e3e; color: white; }
    .btn-cancel { background: #a0aec0; color: white; }
  </style>
</head>
<body>

<div class="calendar-container">
  <div class="top-bar">
    <div>
      <span id="status-text" class="status-text">🔒 동기화 미연결</span>
      <button id="btn-login" class="btn-auth btn-login" onclick="handleLogin()">구글 로그인</button>
      <button id="btn-logout" class="btn-auth btn-logout" onclick="handleLogout()">로그아웃</button>
    </div>
    
    <div class="control-btns">
      <button onclick="document.getElementById('bgFileInput').click()">🖼️ 배경 지정</button>
      <button onclick="removeBgImage()">❌ 배경 삭제</button>
      <input type="file" id="bgFileInput" accept="image/*" style="display:none" onchange="uploadBgImage(event)">
    </div>
  </div>

  <div class="title-area">
    <h2 id="main-title">PRO 스마트 달력</h2>
    <button class="btn-edit-title" onclick="editCalendarTitle()">✏️ 제목 수정</button>
  </div>

  <div class="nav-area">
    <button class="nav-btn" onclick="changeMonth(-1)">◀ 이전달</button>
    <span id="month-title" class="current-month"></span>
    <button class="nav-btn" onclick="changeMonth(1)">다음달 ▶</button>
  </div>

  <div class="calendar-grid">
    <div class="day-header sun">일</div>
    <div class="day-header">월</div>
    <div class="day-header">화</div>
    <div class="day-header">수</div>
    <div class="day-header">목</div>
    <div class="day-header">금</div>
    <div class="day-header sat">토</div>
  </div>
  <div id="calendar-days" class="calendar-grid"></div>
</div>

<!-- 일정 등록 모달 -->
<div id="eventModal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="modalDateTitle">일정 / 알림 설정</h3>
    
    <div class="form-group">
      <label>일정 메모</label>
      <input type="text" id="inputMemo" placeholder="예: 현장 점검, 생일, 제사">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>글자 색상</label>
        <select id="selectTextColor">
          <option value="fc-black">검정색</option>
          <option value="fc-red">빨간색</option>
          <option value="fc-blue">파란색</option>
          <option value="fc-green">초록색</option>
        </select>
      </div>
      <div class="form-group">
        <label>형광펜 (배경색)</label>
        <select id="selectBgColor">
          <option value="hl-yellow">노란색</option>
          <option value="hl-mint">민트색</option>
          <option value="hl-pink">분홍색</option>
          <option value="hl-blue">파란색</option>
          <option value="hl-orange">주황색</option>
          <option value="hl-none">회색(기본)</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>양력 / 음력 기준</label>
        <select id="selectCalType">
          <option value="solar">양력 기준</option>
          <option value="lunar">음력 기준 (생신/제사)</option>
        </select>
      </div>
      <div class="form-group">
        <label>반복 옵션</label>
        <select id="selectRepeat">
          <option value="none">반복 안함</option>
          <option value="yearly">매년 반복</option>
          <option value="monthly">매월 반복</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>알림 시점</label>
        <select id="selectAlertTiming">
          <option value="0">당일 알림</option>
          <option value="1">1일 전 알림</option>
          <option value="2">2일 전 알림</option>
          <option value="3">3일 전 알림</option>
        </select>
      </div>
      <div class="form-group">
        <label>알림 시간</label>
        <input type="time" id="inputAlertTime" value="09:00">
      </div>
    </div>

    <div class="modal-buttons">
      <button class="btn btn-del" id="btnDelete" onclick="deleteEvent()">삭제</button>
      <button class="btn btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn btn-save" onclick="saveEvent()">저장</button>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDTOKW3Y3pEFikEMBQllyn46wP3_XInJhM",
    authDomain: "my-calendar-2b531.firebaseapp.com",
    projectId: "my-calendar-2b531",
    storageBucket: "my-calendar-2b531.firebasestorage.app",
    messagingSenderId: "391516744396",
    appId: "1:391516744396:web:214d5afeae8474df76b069"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentDate = new Date();
  let selectedDateStr = "";
  let selectedLunarMD = "";
  let currentUser = null;
  let userEvents = {};
  let calendarTitle = "PRO 스마트 달력";

  const savedBg = localStorage.getItem("smart_calendar_bg");
  if (savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;

  function handleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(error => { alert("로그인 오류: " + error.message); });
  }

  function handleLogout() { auth.signOut(); }

  auth.onAuthStateChanged(user => {
    currentUser = user;
    const statusText = document.getElementById("status-text");
    const btnLogin = document.getElementById("btn-login");
    const btnLogout = document.getElementById("btn-logout");

    if (user) {
      statusText.innerText = "☁️ " + user.displayName + "님";
      btnLogin.style.display = "none";
      btnLogout.style.display = "inline-block";
      loadUserData();
    } else {
      statusText.innerText = "🔒 동기화 미연결";
      btnLogin.style.display = "inline-block";
      btnLogout.style.display = "none";
      userEvents = JSON.parse(localStorage.getItem("smart_calendar_events") || "{}");
      renderCalendar();
    }
  });

  function editCalendarTitle() {
    const newTitle = prompt("변경할 달력 제목을 입력하세요:", calendarTitle);
    if (newTitle !== null && newTitle.trim() !== "") {
      calendarTitle = newTitle.trim();
      document.getElementById("main-title").innerText = calendarTitle;
      if (currentUser) {
        db.collection("users").doc(currentUser.uid).set({ title: calendarTitle }, { merge: true });
      } else {
        localStorage.setItem("smart_calendar_title", calendarTitle);
      }
    }
  }

  function uploadBgImage(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const bgData = e.target.result;
        document.body.style.backgroundImage = `url('${bgData}')`;
        try { localStorage.setItem("smart_calendar_bg", bgData); } catch(err) {}
      };
      reader.readAsDataURL(file);
    }
  }

  function removeBgImage() {
    document.body.style.backgroundImage = "";
    localStorage.removeItem("smart_calendar_bg");
    alert("배경 사진이 삭제되었습니다.");
  }

  function getExactLunarDate(year, month, day) {
    try {
      const dateObj = new Date(year, month - 1, day);
      const formatter = new Intl.DateTimeFormat('ko-KR-u-ca-chinese', { month: 'numeric', day: 'numeric' });
      const parts = formatter.formatToParts(dateObj);
      let m = '', d = '';
      for (const part of parts) {
        if (part.type === 'month') m = part.value.replace('월', '').trim();
        if (part.type === 'day') d = part.value.replace('일', '').trim();
      }
      return `${m}.${d}`;
    } catch (e) { return ''; }
  }

  // 24절기 (2026 ~ 2028년 국립천문연구원 데이터)
  const solarTerms = {
    // 2026년
    "2026-02-04":"입춘","2026-02-19":"우수","2026-03-05":"경칩","2026-03-20":"춘분","2026-04-05":"청명","2026-04-20":"곡우",
    "2026-05-05":"입하","2026-05-21":"소만","2026-06-06":"망종","2026-06-21":"하지","2026-07-07":"소서","2026-07-23":"대서",
    "2026-08-07":"입추","2026-08-23":"처서","2026-09-07":"백로","2026-09-23":"추분","2026-10-08":"한로","2026-10-23":"상강",
    "2026-11-07":"입동","2026-11-22":"소설","2026-12-07":"대설","2026-12-22":"동지","2027-01-05":"소한","2027-01-20":"대한",

    // 2027년
    "2027-02-04":"입춘","2027-02-19":"우수","2027-03-06":"경칩","2027-03-21":"춘분","2027-04-05":"청명","2027-04-20":"곡우",
    "2027-05-06":"입하","2027-05-21":"소만","2027-06-06":"망종","2027-06-21":"하지","2027-07-07":"소서","2027-07-23":"대서",
    "2027-08-08":"입추","2027-08-23":"처서","2027-09-08":"백로","2027-09-23":"추분","2027-10-08":"한로","2027-10-24":"상강",
    "2027-11-07":"입동","2027-11-22":"소설","2027-12-07":"대설","2027-12-22":"동지","2028-01-05":"소한","2028-01-20":"대한",

    // 2028년
    "2028-02-04":"입춘","2028-02-19":"우수","2028-03-05":"경칩","2028-03-20":"춘분","2028-04-04":"청명","2028-04-19":"곡우",
    "2028-05-05":"입하","2028-05-20":"소만","2028-06-05":"망종","2028-06-21":"하지","2028-07-06":"소서","2028-07-22":"대서",
    "2028-08-07":"입추","2028-08-22":"처서","2028-09-07":"백로","2028-09-22":"추분","2028-10-07":"한로","2028-10-23":"상강",
    "2028-11-07":"입동","2028-11-22":"소설","2028-12-06":"대설","2028-12-21":"동지","2029-01-05":"소한","2029-01-20":"대한"
  };

  // 삼복 (2026 ~ 2028년)
  const bokDays = {
    "2026-07-15":"초복","2026-07-25":"중복","2026-08-14":"말복",
    "2027-07-16":"초복","2027-07-26":"중복","2027-08-15":"말복",
    "2028-07-14":"초복","2028-07-24":"중복","2028-08-13":"말복"
  };

  const fixedHolidays = {
    "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날",
    "06-06": "현충일", "08-15": "광복절", "10-03": "개천절",
    "10-09": "한글날", "12-25": "성탄절"
  };

  function getHolidayInfo(year, month, day, lunarMD) {
    const mm = String(month).padStart(2, '0');
    const dd = String(day).padStart(2, '0');
    const md = `${mm}-${dd}`;

    if (fixedHolidays[md]) return { name: fixedHolidays[md], isHoliday: true };

    if (lunarMD === "1.1") return { name: "설날", isHoliday: true };
    if (lunarMD === "12.29" || lunarMD === "12.30" || lunarMD === "1.2") return { name: "설날 연휴", isHoliday: true };

    if (lunarMD === "8.15") return { name: "추석", isHoliday: true };
    if (lunarMD === "8.14" || lunarMD === "8.16") return { name: "추석 연휴", isHoliday: true };

    if (lunarMD === "4.8") return { name: "부처님오신날", isHoliday: true };

    if (year === 2027 && month === 2 && day === 8) return { name: "대체공휴일", isHoliday: true };

    return { name: "", isHoliday: false };
  }

  function changeMonth(diff) {
    currentDate.setMonth(currentDate.getMonth() + diff);
    renderCalendar();
  }

  function getMatchingEvents(year, month, day, lunarMD) {
    const mm = String(month).padStart(2, '0');
    const dd = String(day).padStart(2, '0');
    const fullKey = `${year}-${mm}-${dd}`;

    let matches = [];
    for (let key in userEvents) {
      const item = userEvents[key];
      if (!item) continue;

      if (item.repeat === "yearly") {
        if (item.calType === "lunar" && item.lunarMD === lunarMD) matches.push(item);
        if (item.calType === "solar" && key.endsWith(`-${mm}-${dd}`)) matches.push(item);
      } else if (item.repeat === "monthly") {
        if (key.endsWith(`-${dd}`)) matches.push(item);
      } else {
        if (key === fullKey) matches.push(item);
      }
    }
    return matches;
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("month-title").innerText = `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const calendarDays = document.getElementById("calendar-days");
    calendarDays.innerHTML = "";

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement("div");
      emptyCell.className = "date-cell";
      calendarDays.appendChild(emptyCell);
    }

    for (let date = 1; date <= lastDate; date++) {
      const cell = document.createElement("div");
      const dayOfWeek = (firstDay + date - 1) % 7;
      const mm = String(month + 1).padStart(2, '0');
      const dd = String(date).padStart(2, '0');
      const dateStr = `${year}-${mm}-${dd}`;

      const lunarMD = getExactLunarDate(year, month + 1, date);
      const holiInfo = getHolidayInfo(year, month + 1, date, lunarMD);
      const termName = solarTerms[dateStr] || "";
      const bokName = bokDays[dateStr] || "";

      let dayClass = "date-cell";
      if (dayOfWeek === 0 || holiInfo.isHoliday) dayClass += " sun holiday";
      if (dayOfWeek === 6 && !holiInfo.isHoliday) dayClass += " sat";

      cell.className = dayClass;

      let badgesHtml = "";
      if (holiInfo.name) badgesHtml += `<span class="badge bg-holiday">🔴 ${holiInfo.name}</span>`;
      if (termName) badgesHtml += `<span class="badge bg-term">🥬 ${termName}</span>`;
      if (bokName) badgesHtml += `<span class="badge bg-bok">🍲 ${bokName}</span>`;

      const matchedEvents = getMatchingEvents(year, month + 1, date, lunarMD);
      let eventsHtml = "";
      matchedEvents.forEach(evt => {
        eventsHtml += `<div class="event-item ${evt.bgColor || 'hl-none'} ${evt.textColor || 'fc-black'}">${evt.memo}</div>`;
      });

      cell.innerHTML = `
        <div class="date-num-row">
          <span class="date-num">${date}</span>
          <span class="lunar-text">(${lunarMD})</span>
        </div>
        ${badgesHtml}
        ${eventsHtml}
      `;

      cell.onclick = () => openModal(dateStr, lunarMD);
      calendarDays.appendChild(cell);
    }
  }

  function openModal(dateStr, lunarMD) {
    selectedDateStr = dateStr;
    selectedLunarMD = lunarMD;
    document.getElementById("modalDateTitle").innerText = `${dateStr} (음력 ${lunarMD}) 일정`;

    const evt = userEvents[dateStr] || {};
    document.getElementById("inputMemo").value = evt.memo || "";
    document.getElementById("selectTextColor").value = evt.textColor || "fc-black";
    document.getElementById("selectBgColor").value = evt.bgColor || "hl-yellow";
    document.getElementById("selectCalType").value = evt.calType || "solar";
    document.getElementById("selectRepeat").value = evt.repeat || "none";
    document.getElementById("selectAlertTiming").value = evt.alertTiming || "0";
    document.getElementById("inputAlertTime").value = evt.alertTime || "09:00";

    document.getElementById("eventModal").style.display = "flex";
  }

  function closeModal() { document.getElementById("eventModal").style.display = "none"; }

  function saveEvent() {
    const memo = document.getElementById("inputMemo").value.trim();
    if (!memo) {
      delete userEvents[selectedDateStr];
    } else {
      userEvents[selectedDateStr] = {
        memo: memo,
        textColor: document.getElementById("selectTextColor").value,
        bgColor: document.getElementById("selectBgColor").value,
        calType: document.getElementById("selectCalType").value,
        repeat: document.getElementById("selectRepeat").value,
        alertTiming: document.getElementById("selectAlertTiming").value,
        alertTime: document.getElementById("inputAlertTime").value,
        lunarMD: selectedLunarMD
      };
    }
    syncData();
    closeModal();
    renderCalendar();
  }

  function deleteEvent() {
    delete userEvents[selectedDateStr];
    syncData();
    closeModal();
    renderCalendar();
  }

  function syncData() {
    if (currentUser) {
      db.collection("users").doc(currentUser.uid).set({ events: userEvents, title: calendarTitle }, { merge: true });
    } else {
      localStorage.setItem("smart_calendar_events", JSON.stringify(userEvents));
    }
  }

  function loadUserData() {
    if (!currentUser) return;
    db.collection("users").doc(currentUser.uid).get().then(doc => {
      if (doc.exists) {
        const data = doc.data();
        if (data.events) userEvents = data.events;
        if (data.title) {
          calendarTitle = data.title;
          document.getElementById("main-title").innerText = calendarTitle;
        }
      }
      renderCalendar();
    });
  }

  renderCalendar();
</script>
</body>
</html>
