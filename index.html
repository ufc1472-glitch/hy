<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO 스마트 일정 달력</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .calendar-container {
      width: 100%;
      max-width: 950px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      padding: 24px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f5f9;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .status-text { font-size: 14px; color: #475569; font-weight: 500; }
    .btn-login {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .title-area { text-align: center; }
    .title-area h2 { margin: 0; font-size: 28px; color: #0f172a; }
    .nav-btn {
      background: #e2e8f0;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .day-header {
      text-align: center;
      font-weight: bold;
      padding: 10px 0;
      color: #64748b;
    }
    .day-header.sun { color: #ef4444; }
    .day-header.sat { color: #3b82f6; }
    .day-cell {
      min-height: 100px;
      border-radius: 10px;
      padding: 6px;
      background: #fff;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }
    .day-cell:hover { background: #f8fafc; }
    .day-number-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .day-num { font-weight: bold; font-size: 16px; }
    .day-cell.sun .day-num, .day-cell.holiday .day-num { color: #ef4444; }
    .day-cell.sat .day-num { color: #3b82f6; }
    .tag {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 2px;
      display: inline-block;
    }
    .tag-holiday { background: #fee2e2; color: #dc2626; font-weight: bold; }
    .tag-term { background: #dcfce7; color: #15803d; }
    .tag-event { background: #e0f2fe; color: #0369a1; font-weight: 500; }
  </style>
</head>
<body>

<div class="calendar-container">
  <div class="top-bar">
    <span id="sync-status" class="status-text">🔒 동기화 미연결 (구글 로그인 시 실시간 연동)</span>
    <button id="auth-btn" class="btn-login" onclick="handleAuth()">구글 계정 로그인</button>
  </div>

  <div class="header">
    <button class="nav-btn" onclick="changeMonth(-1)">◀ 이전달</button>
    <div class="title-area">
      <h2 id="calendar-title">2026년 10월</h2>
    </div>
    <button class="nav-btn" onclick="changeMonth(1)">다음달 ▶</button>
  </div>

  <div class="grid" id="calendar-grid"></div>
</div>

<script>
  // 선생님의 Firebase 실제 프로젝트 설정
  const firebaseConfig = {
    authDomain: "calendar-98064.firebaseapp.com",
    projectId: "calendar-98064",
    storageBucket: "calendar-98064.firebasestorage.app",
    messagingSenderId: "1032338665042",
    appId: "1:1032338665042:web:9455331e84a22ba384d7cd"
  };

  // 중복 초기화 방지 구문
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentDate = new Date(2026, 9, 1); // 2026년 10월 기본
  let currentUser = null;
  let userEvents = {};

  // 24절기 / 복날 / 명절 / 공휴일 자동 데이터
  const fixedInfo = {
    "2026-01-01": { holiday: "신정" },
    "2026-01-05": { term: "소한" },
    "2026-01-20": { term: "대한" },
    "2026-02-04": { term: "입춘" },
    "2026-02-16": { holiday: "설날 연휴" },
    "2026-02-17": { holiday: "설날" },
    "2026-02-18": { holiday: "설날 연휴" },
    "2026-02-19": { term: "우수" },
    "2026-03-01": { holiday: "삼일절" },
    "2026-03-02": { holiday: "대체공휴일" },
    "2026-03-06": { term: "경칩" },
    "2026-03-21": { term: "춘분" },
    "2026-04-05": { term: "청명" },
    "2026-04-20": { term: "곡우" },
    "2026-05-05": { holiday: "어린이날", term: "입하" },
    "2026-05-21": { term: "소만" },
    "2026-05-24": { holiday: "부처님오신날" },
    "2026-05-25": { holiday: "대체공휴일" },
    "2026-06-06": { holiday: "현충일", term: "망종" },
    "2026-06-21": { term: "하지" },
    "2026-07-07": { term: "소서" },
    "2026-07-15": { term: "초복" },
    "2026-07-23": { term: "대서" },
    "2026-07-25": { term: "중복" },
    "2026-08-07": { term: "입추" },
    "2026-08-14": { term: "말복" },
    "2026-08-15": { holiday: "광복절" },
    "2026-08-23": { term: "처서" },
    "2026-09-07": { term: "백로" },
    "2026-09-18": { event: "서부본부 교육14:00" },
    "2026-09-23": { term: "추분" },
    "2026-09-24": { holiday: "추석 연휴" },
    "2026-09-25": { holiday: "추석" },
    "2026-09-26": { holiday: "추석 연휴" },
    "2026-09-29": { event: "경환 생일" },
    "2026-10-03": { holiday: "개천절" },
    "2026-10-04": { event: "집사람 탄신일" },
    "2026-10-08": { term: "한로" },
    "2026-10-09": { holiday: "한글날" },
    "2026-10-16": { event: "장모님 생신" },
    "2026-10-23": { term: "상강" },
    "2026-10-25": { event: "매부생일" },
    "2026-11-07": { term: "입동" },
    "2026-11-22": { term: "소설" },
    "2026-12-07": { term: "대설" },
    "2026-12-22": { term: "동지" },
    "2026-12-25": { holiday: "성탄절" }
  };

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    
    document.getElementById("calendar-title").innerText = `${year}년 ${month + 1}월`;
    const grid = document.getElementById("calendar-grid");
    grid.innerHTML = "";

    const days = ["일", "월", "화", "수", "목", "금", "토"];
    days.forEach((day, idx) => {
      const dayHeader = document.createElement("div");
      dayHeader.className = "day-header" + (idx === 0 ? " sun" : idx === 6 ? " sat" : "");
      dayHeader.innerText = day;
      grid.appendChild(dayHeader);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement("div");
      emptyCell.className = "day-cell empty";
      grid.appendChild(emptyCell);
    }

    for (let date = 1; date <= lastDate; date++) {
      const cell = document.createElement("div");
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
      const dayOfWeek = new Date(year, month, date).getDay();

      let cellClass = "day-cell";
      if (dayOfWeek === 0) cellClass += " sun";
      if (dayOfWeek === 6) cellClass += " sat";

      const info = fixedInfo[dateStr] || {};
      if (info.holiday) cellClass += " holiday";

      cell.className = cellClass;
      cell.onclick = () => addEvent(dateStr);

      let html = `
        <div class="day-number-row">
          <span class="day-num">${date}</span>
        </div>
        <div>
      `;

      if (info.holiday) html += `<div class="tag tag-holiday">🔴 ${info.holiday}</div><br>`;
      if (info.term) html += `<div class="tag tag-term">🥬 ${info.term}</div><br>`;
      if (info.event) html += `<div class="tag tag-event">📌 ${info.event}</div><br>`;
      if (userEvents[dateStr]) html += `<div class="tag tag-event">📅 ${userEvents[dateStr]}</div>`;

      html += `</div>`;
      cell.innerHTML = html;
      grid.appendChild(cell);
    }
  }

  function changeMonth(diff) {
    currentDate.setMonth(currentDate.getMonth() + diff);
    renderCalendar();
  }

  function handleAuth() {
    if (currentUser) {
      auth.signOut().then(() => {
        currentUser = null;
        userEvents = {};
        document.getElementById("sync-status").innerText = "🔒 동기화 미연결 (구글 로그인 시 실시간 연동)";
        document.getElementById("auth-btn").innerText = "구글 계정 로그인";
        renderCalendar();
      });
      return;
    }

    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).then((result) => {
      currentUser = result.user;
      document.getElementById("sync-status").innerText = `🟢 ${currentUser.displayName}님 로그인됨`;
      document.getElementById("auth-btn").innerText = "로그아웃";
      loadUserEvents();
    }).catch((err) => {
      alert("로그인 중 오류가 발생했습니다: " + err.message);
    });
  }

  function loadUserEvents() {
    if (!currentUser) return;
    db.collection("users").doc(currentUser.uid).get().then((doc) => {
      if (doc.exists && doc.data().events) {
        userEvents = doc.data().events;
        renderCalendar();
      }
    });
  }

  function addEvent(dateStr) {
    if (!currentUser) {
      alert("일정을 추가하거나 저장하려면 먼저 [구글 계정 로그인]을 눌러주세요.");
      return;
    }
    const memo = prompt(`${dateStr} 일정을 입력하세요:`, userEvents[dateStr] || "");
    if (memo !== null) {
      if (memo.trim() === "") {
        delete userEvents[dateStr];
      } else {
        userEvents[dateStr] = memo.trim();
      }
      db.collection("users").doc(currentUser.uid).set({ events: userEvents }, { merge: true })
        .then(() => { renderCalendar(); });
    }
  }

  // 자동 로그인 유지 체크
  auth.onAuthStateChanged((user) => {
    if (user) {
      currentUser = user;
      document.getElementById("sync-status").innerText = `🟢 ${currentUser.displayName}님 로그인됨`;
      document.getElementById("auth-btn").innerText = "로그아웃";
      loadUserEvents();
    }
  });

  renderCalendar();
</script>
</body>
</html>
