<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 만세력 달력</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --bg-overlay: rgba(255, 255, 255, 0.95); --primary-color: #2c3e50; }
        body { margin: 0; padding: 15px; font-family: 'Malgun Gothic', sans-serif; background-size: cover; background-position: center; background-attachment: fixed; }

        /* 동기화 코드 모달 */
        #syncSetupModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .setup-card { background: #fff; padding: 30px; border-radius: 12px; text-align: center; width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .setup-card input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; text-align: center; }

        /* 메인 달력 */
        .calendar-container { max-width: 1100px; margin: 0 auto; background: var(--bg-overlay); padding: 20px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
        .header { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; margin-bottom: 15px; border-bottom: 2px solid #ddd; padding-bottom: 15px; }
        .title-section { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .calendar-title { font-size: 2rem; font-weight: bold; color: var(--primary-color); }
        .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

        button, label.btn { padding: 8px 12px; border: none; border-radius: 6px; background-color: var(--primary-color); color: white; cursor: pointer; font-size: 0.85rem; }
        button:hover, label.btn:hover { opacity: 0.9; }

        .month-nav { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 15px 0; font-size: 1.4rem; font-weight: bold; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: #ccc; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
        .day-header { background: #f4f4f6; padding: 10px; text-align: center; font-weight: bold; }
        .day-header.sun { color: #e74c3c; } .day-header.sat { color: #2980b9; }

        .day-cell { background: white; min-height: 105px; padding: 6px; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; }
        .day-cell:hover { background: #f0f7ff; }

        .date-number { font-weight: bold; font-size: 1rem; }
        .sun { color: #e74c3c; } .sat { color: #2980b9; } .holiday { color: #e74c3c; font-weight: bold; }
        .lunar-info { font-size: 0.75rem; color: #7f8c8d; }
        .solar-term { font-size: 0.75rem; color: #27ae60; font-weight: bold; }

        /* 일정 아이템 */
        .event-item { margin-top: 3px; padding: 2px 4px; border-radius: 3px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
        .event-item .del-btn { background: none; border: none; color: #555; cursor: pointer; font-size: 0.75rem; padding: 0 2px; }

        /* 일정 등록 모달 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 320px; display: flex; flex-direction: column; gap: 8px; }
        .modal-content input[type="text"], .modal-content select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- 동기화 코드 모달 -->
    <div id="syncSetupModal" style="display:none;">
        <div class="setup-card">
            <h2>📅 동기화 아이디 입력</h2>
            <p style="font-size:0.85rem; color:#666;">PC와 스마트폰에서 함께 사용할<br>나만의 동기화 아이디를 입력해주세요.</p>
            <input type="text" id="syncCodeInput" placeholder="예: jiwoo">
            <button onclick="saveSyncCode()" style="width:100%; padding:10px; font-size:1rem;">확인 및 달력 시작</button>
        </div>
    </div>

    <!-- 메인 달력 -->
    <div class="calendar-container">
        <div class="header">
            <div class="title-section">
                <span class="calendar-title" id="displayCalendarTitle">나의 영구 달력</span>
                <button onclick="changeCalendarTitle()">✏️ 이름 변경</button>
            </div>
            <div class="controls">
                <label class="btn">📷 배경 변경 <input type="file" accept="image/*" style="display:none;" onchange="changeBackground(event)"></label>
                <button onclick="resetSyncCode()" style="background-color:#7f8c8d;">⚙️ 동기화 아이디 변경</button>
            </div>
        </div>

        <div class="month-nav">
            <button onclick="moveMonth(-1)">◀ 이전달</button>
            <span id="currentYearMonth"></span>
            <button onclick="moveMonth(1)">다음달 ▶</button>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- 일정 모달 -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <h3>일정 및 알람 등록</h3>
            <input type="text" id="eventTitle" placeholder="일정 제목 입력">
            <div>
                <label><input type="radio" name="calendarType" value="solar" checked> 양력</label>
                <label><input type="radio" name="calendarType" value="lunar"> 음력</label>
            </div>
            <div><label>글자 색상:</label><input type="color" id="textColor" value="#000000"></div>
            <div><label>형광펜 색상:</label><input type="color" id="hlColor" value="#ffffaa"></div>
            <label>알람 시점:</label>
            <select id="alarmTiming"><option value="today">당일</option><option value="1day">1일 전</option></select>
            <label>시간대:</label>
            <select id="alarmTime"><option value="AM">오전 (09:00)</option><option value="PM">오후 (18:00)</option></select>
            <label>반복 설정:</label>
            <select id="repeatOption">
                <option value="none">반복 안함</option>
                <option value="monthly">매월 반복</option>
                <option value="yearly">매년 무제한 반복</option>
            </select>
            <button onclick="saveEvent()">저장</button>
            <button onclick="closeModal()" style="background:#7f8c8d;">취소</button>
        </div>
    </div>

<script>
    // --- 1. Firebase 데이터베이스 설정 ---
    const firebaseConfig = {
        apiKey: "AIzaSyDemoKeyForRealtimeSyncCalendar",
        authDomain: "sync-calendar-demo.firebaseapp.com",
        projectId: "sync-calendar-demo",
        storageBucket: "sync-calendar-demo.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:demo"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // --- 2. 고정 양력 공휴일 정의 ---
    const FIXED_HOLIDAYS = {
        "1-1": "신정",
        "3-1": "삼일절",
        "5-5": "어린이날",
        "6-6": "현충일",
        "8-15": "광복절",
        "10-3": "개천절",
        "10-9": "한글날",
        "12-25": "성탄절"
    };

    // --- 3. 연도별 음력 설날/추석 명절 및 대체공휴일 매핑 ---
    const SPECIAL_HOLIDAYS = {
        // 2027년
        "2027-02-05": "설날 연휴", "2027-02-06": "설날", "2027-02-07": "설날 연휴", "2027-02-08": "대체공휴일",
        "2027-09-14": "추석 연휴", "2027-09-15": "추석", "2027-09-16": "추석 연휴",
        // 2028년
        "2028-01-26": "설날 연휴", "2028-01-27": "설날", "2028-01-28": "설날 연휴",
        "2028-10-02": "추석 연휴", "2028-10-03": "추석", "2028-10-04": "추석 연휴", "2028-10-05": "대체공휴일"
    };

    // --- 4. 음력 날짜 범용 계산 알고리즘 ---
    function getLunarDateStr(y, m, d) {
        let current = new Date(y, m - 1, d);
        // 기준점: 2028년 1월 27일 = 음력 2028년 1월 1일 (설날)
        let refDate = new Date(2028, 0, 27);
        let diffDays = Math.floor((current - refDate) / (1000 * 60 * 60 * 24));
        
        let lunarDate = new Date(2028, 0, 1 + diffDays);
        let lunarM = lunarDate.getMonth() + 1;
        let lunarD = lunarDate.getDate();
        return `음 ${lunarM}.${lunarD}`;
    }

    function getSolarTerm(m, d) {
        const terms = {
            1: {5:"소한", 20:"대한"}, 2: {4:"입춘", 19:"우수"}, 3: {6:"경칩", 21:"춘분"}, 4: {5:"청명", 20:"곡우"},
            5: {5:"입하", 21:"소만"}, 6: {6:"망종", 21:"하지"}, 7: {7:"작서", 23:"대서"}, 8: {7:"입추", 23:"처서"},
            9: {7:"백로", 23:"추분"}, 10: {8:"한로", 23:"상강"}, 11: {7:"입동", 22:"소설"}, 12: {7:"대설", 22:"동지"}
        };
        return terms[m]?.[d] || null;
    }

    // --- 5. 상태 및 데이터 처리 ---
    let currentDate = new Date();
    let selectedCellDate = null;
    let syncCode = localStorage.getItem('calendar_sync_code') || '';
    let events = {};

    function initCalendar() {
        if (!syncCode) {
            document.getElementById('syncSetupModal').style.display = 'flex';
        } else {
            document.getElementById('syncSetupModal').style.display = 'none';
            startRealtimeSync();
        }
    }

    function saveSyncCode() {
        const input = document.getElementById('syncCodeInput').value.trim();
        if(!input) return alert('아이디를 입력해주세요.');
        syncCode = input;
        localStorage.setItem('calendar_sync_code', syncCode);
        document.getElementById('syncSetupModal').style.display = 'none';
        startRealtimeSync();
    }

    function resetSyncCode() {
        const newCode = prompt("새로운 동기화 아이디를 입력하세요:", syncCode);
        if(newCode) {
            syncCode = newCode.trim();
            localStorage.setItem('calendar_sync_code', syncCode);
            startRealtimeSync();
        }
    }

    function startRealtimeSync() {
        db.collection("users").doc(syncCode).onSnapshot((doc) => {
            if (doc.exists && doc.data().events) {
                events = doc.data().events;
            } else {
                events = JSON.parse(localStorage.getItem('calendar_events_' + syncCode) || '{}');
            }
            renderCalendar();
        });
    }

    function changeCalendarTitle() {
        const t = prompt("달력 이름을 입력하세요:", document.getElementById('displayCalendarTitle').innerText);
        if(t) { document.getElementById('displayCalendarTitle').innerText = t; localStorage.setItem('calendar_title', t); }
    }

    function changeBackground(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) { document.body.style.backgroundImage = `url(${evt.target.result})`; localStorage.setItem('calendar_bg', evt.target.result); }
            reader.readAsDataURL(file);
        }
    }

    function moveMonth(delta) { currentDate.setMonth(currentDate.getMonth() + delta); renderCalendar(); }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
        const year = currentDate.getFullYear(), month = currentDate.getMonth() + 1;
        document.getElementById('currentYearMonth').innerText = `${year}년 ${month}월`;

        ['일', '월', '화', '수', '목', '금', '토'].forEach((d, idx) => {
            const h = document.createElement('div'); h.className = `day-header ${idx===0?'sun':idx===6?'sat':''}`; h.innerText = d; grid.appendChild(h);
        });

        const firstDay = new Date(year, month - 1, 1).getDay(), lastDate = new Date(year, month, 0).getDate();
        for(let i=0; i<firstDay; i++){ const empty = document.createElement('div'); empty.className = 'day-cell'; empty.style.background = '#f8f8f8'; grid.appendChild(empty); }

        for(let d=1; d<=lastDate; d++){
            const cell = document.createElement('div'); cell.className = 'day-cell';
            const dow = new Date(year, month - 1, d).getDay();
            const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const shortKey = `${month}-${d}`;

            let numClass = 'date-number'; 
            if(dow === 0) numClass += ' sun'; 
            if(dow === 6) numClass += ' sat';

            const lunarStr = getLunarDateStr(year, month, d);
            const solarTerm = getSolarTerm(month, d);
            
            // 공휴일 확인 (고정 양력 공휴일 OR 음력/명절 공휴일)
            let holidayName = FIXED_HOLIDAYS[shortKey] || SPECIAL_HOLIDAYS[dateStr];

            if(holidayName) numClass += ' holiday';

            let cellHTML = `<span class="${numClass}">${d}</span><span class="lunar-info">${lunarStr}</span>`;
            if(solarTerm) cellHTML += `<span class="solar-term">${solarTerm}</span>`;
            if(holidayName) cellHTML += `<span class="holiday" style="font-size:0.75rem;">${holidayName}</span>`;

            cell.innerHTML = cellHTML;

            if(events[dateStr]) {
                events[dateStr].forEach((ev, idx) => {
                    const evDiv = document.createElement('div'); evDiv.className = 'event-item'; evDiv.style.color = ev.textColor; evDiv.style.backgroundColor = ev.hlColor;
                    evDiv.innerHTML = `<span>${ev.title}</span> <button class="del-btn" onclick="deleteEvent(event, '${dateStr}', ${idx})">✕</button>`;
                    cell.appendChild(evDiv);
                });
            }

            cell.onclick = (e) => { if(e.target.tagName !== 'BUTTON') openEventModal(dateStr); };
            grid.appendChild(cell);
        }
    }

    function openEventModal(dateKey) { selectedCellDate = dateKey; document.getElementById('eventModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('eventModal').style.display = 'none'; }

    function syncDataToCloud() {
        if(syncCode) {
            localStorage.setItem('calendar_events_' + syncCode, JSON.stringify(events));
            db.collection("users").doc(syncCode).set({ events: events }, { merge: true });
        }
    }

    function saveEvent() {
        const title = document.getElementById('eventTitle').value;
        if(!title) return alert('일정 제목을 입력해주세요.');

        const newEvent = {
            title,
            type: document.querySelector('input[name="calendarType"]:checked').value,
            textColor: document.getElementById('textColor').value,
            hlColor: document.getElementById('hlColor').value,
            timing: document.getElementById('alarmTiming').value,
            time: document.getElementById('alarmTime').value,
            repeat: document.getElementById('repeatOption').value
        };

        if(!events[selectedCellDate]) events[selectedCellDate] = [];
        events[selectedCellDate].push(newEvent);

        syncDataToCloud();
        document.getElementById('eventTitle').value = '';
        closeModal();
        renderCalendar();
    }

    function deleteEvent(e, dateKey, index) {
        e.stopPropagation();
        if(confirm('해당 일정을 삭제하시겠습니까?')) {
            events[dateKey].splice(index, 1);
            if(events[dateKey].length === 0) delete events[dateKey];
            syncDataToCloud();
            renderCalendar();
        }
    }

    window.onload = function() {
        const savedTitle = localStorage.getItem('calendar_title'); if(savedTitle) document.getElementById('displayCalendarTitle').innerText = savedTitle;
        const savedBg = localStorage.getItem('calendar_bg'); if(savedBg) document.body.style.backgroundImage = `url(${savedBg})`;
        initCalendar();
    }
</script>
</body>
</html>
