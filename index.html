<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRO 스마트 달력</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Malgun Gothic', -apple-system, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 5px; display: flex; justify-content: center; }
    
    /* 모바일 맞춤 전체 컨테이너 */
    .calendar-container { 
      background: #ffffff; 
      width: 100%; 
      max-width: 800px; 
      padding: 10px; 
      border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
    }
    
    .header-status { background: #edf2f7; padding: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .status-text { font-size: 11px; font-weight: bold; color: #4a5568; word-break: break-all; }
    .btn-login { background: #3182ce; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .btn-logout { background: #e53e3e; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; cursor: pointer; display: none; white-space: nowrap; }

    .title-area { display: flex; justify-content: center; align-items: center; gap: 6px; margin-bottom: 10px; }
    .title-area h2 { margin: 0; font-size: 18px; color: #1a202c; font-weight: bold; }
    .btn-edit-title { background: #e2e8f0; border: 1px solid #cbd5e0; padding: 3px 6px; border-radius: 5px; font-size: 11px; font-weight: bold; cursor: pointer; color: #2d3748; }

    .nav-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .nav-btn { background: #edf2f7; border: 1px solid #cbd5e0; padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .current-month { font-size: 16px; font-weight: bold; color: #2d3748; }

    /* 7열 그리드 스마트폰 화면 자동 축소 */
    .calendar-grid { 
      display: grid; 
      grid-template-columns: repeat(7, 1fr); 
      gap: 1px; 
      text-align: center; 
      width: 100%;
    }
    
    .day-header { font-weight: bold; padding: 4px 0; font-size: 12px; }
    .day-header.sun { color: #e53e3e; }
    .day-header.sat { color: #3182ce; }
    
    /* 셀 간격 및 높이 스마트폰 최적화 */
    .date-cell { 
      min-height: 75px; 
      border: 1px solid #e2e8f0; 
      border-radius: 4px; 
      padding: 2px; 
      background: white; 
      cursor: pointer; 
      display: flex; 
      flex-direction: column; 
      justify-content: flex-start; 
      text-align: left; 
      overflow: hidden; 
    }
    .date-cell:hover { background: #ebf8ff; }

    .date-header-row { display: flex; align-items: baseline; justify-content: flex-start; gap: 2px; flex-wrap: wrap; }
    .date-num { font-size: 13px; font-weight: bold; }
    .sun .date-num, .holiday .date-num { color: #e53e3e; }
    .sat .date-num { color: #3182ce; }
    .lunar-text { font-size: 9px; color: #718096; }

    .solar-term { font-size: 8px; color: #2f855a; background: #c6f6d5; padding: 1px 2px; border-radius: 2px; margin-top: 1px; width: fit-content; white-space: nowrap; }
    .holiday-tag { font-size: 8px; color: #9b2c2c; background: #fed7d7; padding: 1px 2px; border-radius: 2px; margin-top: 1px; width: fit-content; font-weight: bold; white-space: nowrap; }
    
    .event-item { 
      font-size: 10px; 
      padding: 1px 3px; 
      border-radius: 3px; 
      margin-top: 1px; 
      text-align: left; 
      font-weight: bold; 
      line-height: 1.1;
      word-break: break-all;
    }

    .hl-mint   { background: #ccfbf1; color: #0f766e; }
    .hl-yellow { background: #fef08a; color: #854d0e; }
    .hl-green  { background: #bbf7d0; color: #166534; }
    .hl-pink   { background: #fbcfe8; color: #9d174d; }
    .hl-blue   { background: #bfdbfe; color: #1e40af; }
    .hl-orange { background: #fed7aa; color: #9a3412; }

    .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 15px; border-radius: 10px; width: 92%; max-width: 380px; }
    .modal-content h3 { margin-top: 0; font-size: 15px; color: #2d3748; }
    .form-group { margin-bottom: 10px; text-align: left; }
    .form-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #4a5568; }
    .form-group input, .form-group select { width: 100%; padding: 6px; border: 1px solid #cbd5e0; border-radius: 5px; font-size: 13px; }

    .modal-buttons { display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px; }
    .btn-save { background: #3182ce; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn-delete { background: #e53e3e; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn-cancel { background: #a0aec0; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; }
  </style>
</head>
<body>

<div class="calendar-container">
  <div class="header-status">
    <span id="status-text" class="status-text">🔒 동기화 미연결</span>
    <button id="btn-login" class="btn-login" onclick="handleLogin()">구글 로그인</button>
    <button id="btn-logout" class="btn-logout" onclick="handleLogout()">로그아웃</button>
  </div>

  <div class="title-area">
    <h2 id="calendar-main-title">PRO 스마트 달력</h2>
    <button class="btn-edit-title" onclick="editCalendarTitle()">✏️ 제목 수정</button>
  </div>

  <div class="nav-area">
    <button class="nav-btn" onclick="changeMonth(-1)">◀ 이전달</button>
    <span id="month-title" class="current-month">2027년 11월</span>
    <button class="nav-btn" onclick="changeMonth(1)">다음달 ▶</button>
  </div>

  <div class="calendar-grid">
    <div class="day-header sun">일</div>
    <div class="day-header">월</div>
    <div class="day-header">화</div>
    <div class="day-header">수</div>
    <div class="day-header">목</div>
    <div class="day-header">금</div>
    <div class="day-header sat">토</div>
  </div>
  <div id="calendar-days" class="calendar-grid"></div>
</div>

<div id="eventModal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="modalDateTitle">일정 및 알림 설정</h3>
    <div class="form-group">
      <label>일정 내용</label>
      <input type="text" id="inputMemo" placeholder="예: 현장 점검, 생일 등">
    </div>
    <div class="form-group">
      <label>형광펜 (배경 색상)</label>
      <select id="selectColor">
        <option value="hl-mint">민트 (기본)</option>
        <option value="hl-yellow">노랑</option>
        <option value="hl-green">초록</option>
        <option value="hl-pink">분홍</option>
        <option value="hl-blue">파랑</option>
        <option value="hl-orange">주황</option>
      </select>
    </div>
    <div class="form-group">
      <label>양력 / 음력 선택</label>
      <select id="selectCalendarType">
        <option value="solar">양력 기준</option>
        <option value="lunar">음력 기준 (생신/제사)</option>
      </select>
    </div>
    <div class="form-group">
      <label>반복 설정</label>
      <select id="selectRepeat">
        <option value="none">반복 안함</option>
        <option value="yearly">매년 반복</option>
        <option value="monthly">매월 반복</option>
      </select>
    </div>
    <div class="form-group">
      <label>알림 시점</label>
      <select id="selectAlertTiming">
        <option value="0">당일 알림</option>
        <option value="1">1일 전 알림</option>
        <option value="2">2일 전 알림</option>
        <option value="3">3일 전 알림</option>
      </select>
    </div>
    <div class="form-group">
      <label>알림 시간</label>
      <input type="time" id="inputTime">
    </div>
    <div class="modal-buttons">
      <button class="btn-delete" id="btnDeleteEvent" onclick="deleteCurrentEvent()">삭제</button>
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveEvent()">저장</button>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDTOKW3Y3pEFikEMBQllyn46wP3_XInJhM",
    authDomain: "my-calendar-2b531.firebaseapp.com",
    projectId: "my-calendar-2b531",
    storageBucket: "my-calendar-2b531.firebasestorage.app",
    messagingSenderId: "391516744396",
    appId: "1:391516744396:web:214d5afeae8474df76b069"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentDate = new Date(2027, 10, 1);
  let currentUser = null;
  let selectedDateStr = "";
  let userEvents = {};
  let calendarTitle = "PRO 스마트 달력";

  // 표준 브라우저 지원 음력 변환
  function getExactLunarDate(year, month, day) {
    try {
      const dateObj = new Date(year, month - 1, day);
      const formatter = new Intl.DateTimeFormat('ko-KR-u-ca-chinese', { month: 'numeric', day: 'numeric' });
      const parts = formatter.formatToParts(dateObj);
      let m = '', d = '';
      for (const part of parts) {
        if (part.type === 'month') m = part.value.replace('월', '').trim();
        if (part.type === 'day') d = part.value.replace('일', '').trim();
      }
      return `${m}.${d}`;
    } catch (e) { return ''; }
  }

  const holidayDB = {
    "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날", 
    "06-06": "현충일", "08-15": "광복절", "10-03": "개천절", 
    "10-09": "한글날", "12-25": "성탄절"
  };

  const termDB = {
    "2027-11-07":"입동","2027-11-22":"소설","2027-12-07":"대설","2027-12-22":"동지"
  };

  function getHolidayName(year, month, day, lunarMD) {
    const mm = String(month).padStart(2, '0');
    const dd = String(day).padStart(2, '0');
    const mdStr = `${mm}-${dd}`;

    if (holidayDB[mdStr]) return holidayDB[mdStr];
    if (lunarMD === "1.1") return "설날";
    if (lunarMD === "8.15") return "추석";
    if (lunarMD === "4.8") return "부처님오신날";

    return "";
  }

  function editCalendarTitle() {
    const newTitle = prompt("새로운 달력 이름을 입력하세요:", calendarTitle);
    if (newTitle !== null && newTitle.trim() !== "") {
      calendarTitle = newTitle.trim();
      document.getElementById("calendar-main-title").innerText = calendarTitle;
      document.title = calendarTitle;
      if (currentUser) db.collection("users").doc(currentUser.uid).set({ title: calendarTitle }, { merge: true });
    }
  }

  function handleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(error => { alert("로그인 오류: " + error.message); });
  }

  function handleLogout() { auth.signOut(); }

  auth.onAuthStateChanged(user => {
    currentUser = user;
    const statusText = document.getElementById("status-text");
    const btnLogin = document.getElementById("btn-login");
    const btnLogout = document.getElementById("btn-logout");

    if (user) {
      statusText.innerText = "☁️ " + user.displayName + "님";
      btnLogin.style.display = "none";
      btnLogout.style.display = "inline-block";
      loadUserData();
    } else {
      statusText.innerText = "🔒 동기화 미연결";
      btnLogin.style.display = "inline-block";
      btnLogout.style.display = "none";
      renderCalendar();
    }
  });

  function changeMonth(diff) {
    currentDate.setMonth(currentDate.getMonth() + diff);
    renderCalendar();
  }

  function getEventForDate(year, month, day, lunarMD) {
    const mm = String(month).padStart(2, '0');
    const dd = String(day).padStart(2, '0');
    const fullKey = `${year}-${mm}-${dd}`;

    let eventList = [];
    for (let key in userEvents) {
      const item = typeof userEvents[key] === 'string' ? { memo: userEvents[key] } : userEvents[key];
      if (key === fullKey) eventList.push(item);
    }
    return eventList;
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("month-title").innerText = `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const calendarDays = document.getElementById("calendar-days");
    calendarDays.innerHTML = "";

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement("div");
      emptyCell.className = "date-cell";
      calendarDays.appendChild(emptyCell);
    }

    for (let date = 1; date <= lastDate; date++) {
      const cell = document.createElement("div");
      const dayOfWeek = (firstDay + date - 1) % 7;
      const mm = String(month + 1).padStart(2, '0');
      const dd = String(date).padStart(2, '0');
      const dateStr = `${year}-${mm}-${dd}`;
      
      const lunarMD = getExactLunarDate(year, month + 1, date);
      const holidayName = getHolidayName(year, month + 1, date, lunarMD);
      const termName = termDB[dateStr] || "";

      let dayClass = "date-cell";
      if (dayOfWeek === 0 || holidayName) dayClass += " sun holiday";
      if (dayOfWeek === 6 && !holidayName) dayClass += " sat";

      cell.className = dayClass;

      const matchedEvents = getEventForDate(year, month + 1, date, lunarMD);

      let extraHtml = "";
      if (holidayName) extraHtml += `<div class="holiday-tag">🔴 ${holidayName}</div>`;
      if (termName) extraHtml += `<div class="solar-term">🥬 ${termName}</div>`;
      
      matchedEvents.forEach(evt => {
        let colorClass = evt.color || 'hl-mint';
        extraHtml += `<div class="event-item ${colorClass}">${evt.memo}</div>`;
      });

      cell.innerHTML = `
        <div class="date-header-row">
          <span class="date-num">${date}</span>
          <span class="lunar-text">(${lunarMD})</span>
        </div>
        ${extraHtml}
      `;

      cell.onclick = () => openModal(dateStr, lunarMD);
      calendarDays.appendChild(cell);
    }
  }

  function openModal(dateStr, lunarMD) {
    selectedDateStr = dateStr;
    document.getElementById("modalDateTitle").innerText = `${dateStr} (음력 ${lunarMD}) 일정`;
    const existing = userEvents[dateStr] || {};
    document.getElementById("inputMemo").value = existing.memo || "";
    document.getElementById("eventModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("eventModal").style.display = "none";
  }

  function saveEvent() {
    const memo = document.getElementById("inputMemo").value.trim();
    if (memo === "") {
      delete userEvents[selectedDateStr];
    } else {
      userEvents[selectedDateStr] = { memo, color: document.getElementById("selectColor").value };
    }
    if (currentUser) db.collection("users").doc(currentUser.uid).set({ events: userEvents }, { merge: true });
    closeModal();
    renderCalendar();
  }

  function deleteCurrentEvent() {
    delete userEvents[selectedDateStr];
    if (currentUser) db.collection("users").doc(currentUser.uid).set({ events: userEvents }, { merge: true });
    closeModal();
    renderCalendar();
  }

  function loadUserData() {
    if (!currentUser) return;
    db.collection("users").doc(currentUser.uid).get().then(doc => {
      if (doc.exists && doc.data().events) {
        userEvents = doc.data().events;
      }
      renderCalendar();
    });
  }

  renderCalendar();
</script>
</body>
</html>
